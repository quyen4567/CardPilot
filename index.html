<body>
<div class="app">
  <header class="top"><div class="between" style="align-items:flex-start"><div><h1 id="title">CardPilot</h1><div class="sub" id="subtitle">Smarter card decisions, without wasting a 5/24 slot.</div></div><div class="small" style="color:#dbe8ff;font-weight:800;margin-top:4px">v11.2.18</div></div></header>
  <main class="content">
    <section id="homeView"></section>
    <section id="cardsView" class="hidden"></section>
    <section id="applyView" class="hidden"></section>
    <section id="offersView" class="hidden"></section>
    <section id="benefitsView" class="hidden"></section>
    <section id="relationshipsView" class="hidden"></section>
    <section id="moreView" class="hidden"></section>
  </main>
  <nav class="tabs">
    <button class="tab active" data-view="homeView"><span>⌂</span>Home</button>
    <button class="tab" data-view="applyView"><span>⌕</span>Find a Card</button>
    <button class="tab reset-tab" type="button" onclick="resetAllRecommendationSettings()"><span>↻</span>Reset</button>
    <button class="tab" data-view="cardsView"><span>▣</span>My Cards</button>
    <button class="tab" data-view="moreView"><span>•••</span>More</button>
  </nav>
</div>
<script>
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
const defaultData={
  profile:{five24Goal:true,businessFirst:true},
  cards:[],
  expenses:[],
  benefits:[],
  offers:[]
};
let data=JSON.parse(localStorage.getItem('cardpilotData')||'null')||defaultData;

// Card catalog is loaded from cards.json so offer/link updates do not require rebuilding the UI.
let BUSINESS_CATALOG=[];
let PERSONAL_CATALOG=[];
const CATALOG_VERSION='2026-09-24.2';

function migrateV8(){
  data.profile=data.profile||{};
  if(!data.profile.cardPath){
    data.profile.cardPath=data.profile.businessFirst===true?'business':data.profile.businessFirst===false?'personal':'either';
  }
  data.profile.businessFirst=data.profile.cardPath!=='personal';
  if(data.catalogVersion!==CATALOG_VERSION){
    // Refresh the market catalog from cards.json. Saved cards live in data.cards,
    // so replacing data.offers does not delete the user's wallet. This also prevents stale
    // cached offer fields from overriding corrected valuations or eligibility requirements.
    data.offers=[...BUSINESS_CATALOG,...PERSONAL_CATALOG];
    data.catalogVersion=CATALOG_VERSION;
    localStorage.setItem('cardpilotData',JSON.stringify(data));
  }
}
// Catalog migration runs after cards.json loads.


// v9 migration: simplify setup and recommendation inputs without deleting saved cards or benefits.
if(data.profile && data.profile.recommendationVersion !== '9.0'){
  if(!data.profile.feePref) data.profile.feePref='justify';
  if(!Array.isArray(data.profile.interests)||!data.profile.interests.length){
    const g=String(data.profile.goal||'').toLowerCase();
    data.profile.interests=g.includes('cash')?['cash']:g.includes('hotel')?['hotel']:g.includes('southwest')?['airline']:g.includes('travel')?['points']:g.includes('maximum')?['hist']:['none'];
  }
  delete data.profile.maxSpend; delete data.profile.goal;
  data.profile.recommendationVersion='9.0';
  data.profile.setupComplete=false; data.profile.setupStep=1; data.profile.showRecommendation=false;
  localStorage.setItem('cardpilotData',JSON.stringify(data));
}

// v10 migration: secondary benefit preferences, companion benefits, and saved strategies.
data.profile=data.profile||{};
if(data.profile.recommendationVersion!=='10.0'){
  data.profile.subInterests=data.profile.subInterests||{airline:[],hotel:[],cruise:[],cash:[]};
  data.profile.savedStrategies=Array.isArray(data.profile.savedStrategies)?data.profile.savedStrategies:[];
  data.profile.recommendationVersion='10.0';
  localStorage.setItem('cardpilotData',JSON.stringify(data));
}
data.profile.subInterests=data.profile.subInterests||{airline:[],hotel:[],cruise:[],cash:[]};
data.profile.savedStrategies=Array.isArray(data.profile.savedStrategies)?data.profile.savedStrategies:[];
data.profile.relationships=data.profile.relationships||{bofaPersonal:'none',bofaBusiness:'none',citi:'none',schwab:'none',morganStanley:'none'};
// v10.10: post-recommendation refinement controls.
// v10.10.20: streamlined onboarding — wallet + 3 quick questions, with the full 7-step editor retained behind the scenes.
// v10.10.19: add flexible step-by-step preference editing without resetting saved answers.
// v10.10.25: cash-back ranking now always considers catch-all rate; relationship boosts apply only when actually saved and enabled.
// v10.10.26: quick setup reordered to annual fee → desired benefits → personal/business/either.
// v10.10.18: add effective catch-all cash-back rates (including relationship boosts) and prioritize stronger baseline cash-back when selected.
if(!data.profile.refineRank)data.profile.refineRank='overall';

function daysTo(d){return Math.ceil((new Date(d+'T12:00:00')-new Date())/86400000)}
function five24Cutoff(){const d=new Date(); d.setHours(0,0,0,0); d.setMonth(d.getMonth()-24); return d}
function validOpenDate(c){if(!c||!c.opened)return null;const d=new Date(c.opened+'T12:00:00');return Number.isNaN(d.getTime())?null:d}
function counts524(c){
  if(c.five24Override==='count')return true;

function five24Status(c){
  if(c.five24Override==='count')return {label:'Counts toward 5/24',reason:'Manual override',tone:'amber'};
  if(c.five24Override==='nocount')return {label:'Does not count',reason:'Manual override',tone:'green'};

  if(!c.reports)return {label:'Does not count',reason:'Does not report as personal',tone:'green'};

  if(!opened)return {label:'Verify 5/24',reason:'Open date missing',tone:'amber'};

function bonusRulesPanelHTML(){return `<div class="subchoices" style="margin-top:16px"><h4>Welcome-bonus eligibility</h4><div class="small">A strong sign-up bonus is only valuable if you are eligible. CardPilot flags known issuer restrictions, but the application terms you actually receive always control.</div><div class="note" style="margin-top:10px"><b>Chase Ink:</b> Current 2025–2026 terms/reporting indicate the classic repeat “Ink train” is no longer a safe assumption. Ink Cash/Unlimited may deny the bonus if you have had the same card or another no-annual-fee Chase business card; Ink Preferred may deny the bonus if you have had that card. Chase may show a bonus-eligibility popup before you continue.</div><div class="note" style="margin-top:8px"><b>Chase Sapphire:</b> Current 2026 terms use product-specific eligibility and a pre-application warning rather than the old simple 48-month rule. CardPilot treats prior Sapphire history as an eligibility warning, not an automatic guarantee.</div><div class="note" style="margin-top:8px"><b>American Express:</b> Many standard Amex offers use “have or have had” and/or family-language restrictions. Some targeted/no-lifetime-language offers exist. Amex often warns you before processing if you are not eligible for the welcome offer.</div><div class="small" style="margin-top:8px">For better screening, record whether you received a welcome bonus and the bonus date when editing cards in My Cards. If you choose <b>exclude cards unlikely to earn a new sign-up bonus</b>, CardPilot uses this history to remove likely-ineligible offers before ranking.</div></div>`}
function normalizedCardName(x){return String(x||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim()}
function findOwnedLike(test){return data.cards.filter(c=>test(normalizedCardName(c.name||''),c))}
function bonusEligibilityInfo(o){
  const n=normalizedCardName(o.name), issuer=String(o.issuer||'').toLowerCase();
  const warnings=[]; let likely=false;
  if(issuer.includes('chase')){
    if(n.includes('ink business cash')||n.includes('ink business unlimited')){
      const held=findOwnedLike(x=>x.includes('ink business cash')||x.includes('ink business unlimited'));
      if(held.length){likely=true;warnings.push('Current no-fee Ink terms may make you ineligible for the welcome bonus if you have had this card or another no-annual-fee Chase business card.');}
      else warnings.push('No-fee Ink bonuses now have restrictive eligibility language; do not assume the old repeat “Ink train” still works.');
    }else if(n.includes('ink business preferred')){
      const held=findOwnedLike(x=>x.includes('ink business preferred'));
      if(held.length){likely=true;warnings.push('Current Ink Preferred terms may make you ineligible for the bonus if you have ever had this card.');}
      else warnings.push('Ink Preferred now carries restrictive prior-card bonus language; Chase may show an eligibility popup during application.');
    }else if(n.includes('sapphire preferred')||n.includes('sapphire reserve')){
      const exact=findOwnedLike(x=>x===n), anySap=findOwnedLike(x=>x.includes('sapphire preferred')||x.includes('sapphire reserve'));
      if(exact.length||anySap.length){if(exact.length)likely=true;warnings.push('Current Sapphire terms can restrict the bonus based on current Sapphire holdings and prior history with this specific Sapphire product.');}
      else warnings.push('Sapphire bonus eligibility changed in 2026; verify the current application terms and any pre-application eligibility message.');
    }else warnings.push('Chase bonus eligibility varies by product; verify the current offer terms before applying.');
  }
  if(issuer.includes('american express')||issuer==='amex'){
    const held=findOwnedLike(x=>x===n);
    if(held.length){likely=true;warnings.push('Many standard Amex offers use “have or have had” language for the same product, so prior ownership can affect welcome-offer eligibility. Targeted/no-lifetime-language offers can differ.');}
    else warnings.push('Many Amex cards have once-per-lifetime or family-language restrictions on standard offers; targeted/no-lifetime-language offers can differ. Amex often provides a popup if you are not eligible.');
  }
  const bonusHistory=findOwnedLike((x,c)=>x===n&&c.bonusReceived==='yes');
  if(bonusHistory.length){likely=true;const d=bonusHistory[0].bonusReceivedDate;warnings.unshift(`You recorded receiving a welcome bonus for this card${d?' on '+d:''}.`);}
  return {likely,warnings};
}
function bonusEligibilityText(o){const e=bonusEligibilityInfo(o);if(!e.warnings.length)return '';return `<div class="small" style="margin-top:7px;color:${e.likely?'#9b2c2c':'#7a5a00'}"><b>sign-up bonus eligibility:</b> ${e.warnings[0]}</div>`}

function catchAllCashRate(o){
  const n=String(o.name||'').toLowerCase(), issuer=String(o.issuer||'').toLowerCase();
  let base=null,note='';
  if(n.includes('robinhood gold card')){base=3;note='3% on eligible purchases under current terms; Robinhood Gold membership/access requirements apply.'}
  else if(n.includes('fidelity rewards')){base=2;note='2% when rewards are deposited into an eligible Fidelity account.'}
  else if(n.includes('double cash')){base=2;note='2% total cash back structure on eligible purchases when purchase and payment components are combined.'}
  else if(n.includes('active cash')||n.includes('signify business cash')){base=2;note='Unlimited 2% cash rewards on eligible purchases.'}
  else if(n.includes('spark cash plus')||n==='spark cash'){base=2;note='2% cash back on general eligible purchases.'}
  else if(n.includes('spark cash select')||n.includes('quicksilver')){base=1.5;note='1.5% cash back on general eligible purchases.'}
  else if(n.includes('ink business unlimited')){base=1.5;note='1.5% cash back / Ultimate Rewards on general eligible purchases.'}
  else if(n.includes('ink business premier')){base=2;note='2% cash back on general eligible purchases; some large-purchase earning may be higher under current terms.'}
  else if(n.includes('freedom unlimited')){base=1.5;note='1.5% cash back / Ultimate Rewards on general eligible purchases, before category bonuses.'}
  else if(n.includes('blue business cash')){base=2;note='2% cash back on eligible purchases up to the card’s annual cap, then 1%.'}
  else if(n.includes('costco anywhere')){base=1;note='1% on purchases outside the card’s bonus categories.'}
  else if(issuer==='bank of america'){
    if(n.includes('unlimited cash rewards')||n.includes('premium rewards')) base=1.5;
    else if(n.includes('customized cash rewards')) base=1;
    if(base!==null){
      const boost=data.profile.applyRelationships===false?0:bofaTierBonus(o.type);
      const effective=base*(1+boost);
      note=boost?`${base.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')}% base rate × ${(1+boost).toFixed(2)} relationship multiplier.`:`${base.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')}% base rate; no relationship boost applied.`;
      return {base,effective,note,relationshipBoost:boost};
    }
  }
  if(base===null)return null;
  return {base,effective:base,note,relationshipBoost:0};
}
function catchAllCashText(o){
  const x=catchAllCashRate(o);if(!x)return '';
  const e=x.effective.toFixed(3).replace(/0+$/,'').replace(/\.$/,'');
  const b=x.base.toFixed(3).replace(/0+$/,'').replace(/\.$/,'');
  const rel=x.relationshipBoost
    ? ` <span style="color:#667085">(base ${b}% + relationship boost)</span>`
    : ` <span style="color:#667085">(base ${b}%; no relationship boost)</span>`;
  let t=`<div class="small" style="margin-top:6px;color:#0b6b3a"><b>Effective catch-all cash back:</b> ${e}%${rel}</div>`;
  if(x.note)t+=`<div class="small" style="margin-top:2px;color:#667085">${x.note}</div>`;
  const spend=annualSpendAmount();
  if(spend)t+=`<div class="small" style="margin-top:2px;color:#365d96">At ${annualSpendLabel()}, that rate is about <b>${fmt(Math.round(spend*x.effective/100))}/year</b> before annual fees, category bonuses, caps, or credits.</div>`;
  return t
}
function cashBackRateScore(o){
  const ints=data.profile.interests||[], cash=(data.profile.subInterests||{}).cash||[];
  if(!ints.includes('cash'))return {score:0,reason:null};
  const x=catchAllCashRate(o);if(!x)return {score:0,reason:null};
  const catchallPriority=cash.includes('catchall')||cash.includes('overall')||cash.length===0;
  // Every cash-back card gets some credit for its baseline/effective catch-all rate.
  // If the user explicitly prioritizes catch-all or overall cash back, weight it more heavily.
  let baseScore=0;
  if(x.effective>=3)baseScore=18;
  else if(x.effective>=2.625)baseScore=15;
  else if(x.effective>=2)baseScore=10;
  else if(x.effective>=1.5)baseScore=5;
  else if(x.effective>0)baseScore=1;
  const score=catchallPriority?baseScore:Math.max(1,Math.round(baseScore*0.45));
  const rate=x.effective.toFixed(3).replace(/0+$/,'').replace(/\.$/,'');
  const relationshipText=x.relationshipBoost
    ? ` after your saved relationship boost`
    : (String(o.issuer||'').toLowerCase()==='bank of america' ? ` with no relationship boost applied` : '');
  return {score,reason:`Catch-all cash-back rate is ${rate}%${relationshipText}. Higher baseline catch-all rates receive more weight when cash back is selected.`};
}

  return {
    southwest:n.includes('southwest')||n.includes('rapid rewards'),
    hotel:n.includes('hyatt')||n.includes('hilton')||n.includes('marriott')||n.includes('ihg')||n.includes('wyndham')||n.includes('hotel'),

function pointCurrency(o){
  const unit=String(o.unit||'').toLowerCase();
  const name=String(o.name||'').toLowerCase();
  const issuer=String(o.issuer||'').toLowerCase();
  // Bilt Palladium is a mixed offer: the 50K component is points and the $300 component
  // is Bilt Cash. Detect the points component before the generic cash guard so an older
  // cached label such as 'Bilt points + $300 Bilt Cash' cannot be misread as $50,000 cash.
  if((issuer==='bilt'||name.includes('bilt')) && Number(o.bonus||0)>=1000 && (unit.includes('point')||name.includes('palladium'))) return 'bilt';
  // Cash-denominated offers must stay cash. Some cash-back cards earn rewards as points
  // behind the scenes, but the advertised welcome offer has a fixed cash value.
  if(unit.includes('cash'))return null;
  const t=String((o.unit||'')+' '+(o.tags||[]).join(' ')+' '+(o.name||'')).toLowerCase();
  if(t.includes('bofa points')||t.includes('bank of america points'))return 'bofa';
  if(t.includes('hyatt'))return 'hyatt';
  if(t.includes('marriott')||t.includes('bonvoy'))return 'marriott';

function selectedCategoryHierarchy(){
  const selected=(Array.isArray(data.profile.interests)?data.profile.interests:[]).filter(x=>x!=='none'&&x!=='hist');
  if(selected.length===1 && ['cruise','hotel','airline'].includes(selected[0]))return selected[0];
  return null;
}
function categorySpecificityTier(o,key){
  const tags=offerTags(o), raw=(o.tags||[]).map(x=>String(x).toLowerCase());
  if(key==='cruise'){
    const branded=raw.some(x=>['carnival','norwegian','princess','royal caribbean','celebrity','silversea','virgin voyages'].includes(x));
    if(tags.cruise&&branded)return 3;
    if(tags.cruise)return 2;
    const cf=cruisePreferenceFit(o,tags);
    return cf.level==='flexible'?1:0;
  }
  if(key==='hotel'){
    if(hotelProgram(o))return 3;
    if(tags.freeNight||tags.hotelStatus||tags.eliteNights||tags.propertyCredit)return 2;
    const hf=hotelPreferenceFit(o,tags);
    return hf.level==='flexible'?1:0;
  }
  if(key==='airline'){
    if(airlineProgram(o))return 3;
    if(tags.airline)return 2;
    if(raw.includes('transferable')&&tags.points)return 1;
    return 0;
  }
  return 0;
}
function rankedOffers(){
  const order={consider:0,wait:1,save:2,verify:3,specialty:4,avoid:5};
  const hierarchy=selectedCategoryHierarchy();
  return pathwayOffers().map(o=>({offer:o,fit:offerFit(o)})).sort((a,b)=>{
    const s=order[a.fit.status]-order[b.fit.status];
    if(s)return s;
    if(a.fit.status==='consider'){
      // If Cruise, Hotel, or Airline is the user's only concrete benefit choice,
      // category-specific cards come before generic flexible-travel alternatives.
      if(hierarchy){
        const at=categorySpecificityTier(a.offer,hierarchy), bt=categorySpecificityTier(b.offer,hierarchy);
        if(bt!==at)return bt-at;
      }
      // Default ranking hierarchy:
      // 1) highest estimated total sign-up bonus value,
      // 2) lower required spend when sign-up bonus values are equal/very close,
      // 3) higher sign-up bonus return on required spend,
      // 4) strategic fit (5/24, fees, preferences, relationships, overlap).
      const av=offerEstimatedSubValue(a.offer), bv=offerEstimatedSubValue(b.offer);
      if(bv!==av)return bv-av;
      const aspend=Number(a.offer.spend||Infinity), bSpend=Number(b.offer.spend||Infinity);
      if(aspend!==bSpend)return aspend-bSpend;
      const ar=subReturnRange(a.offer), br=subReturnRange(b.offer);
      const aroi=ar?ar.mid:-1, broi=br?br.mid:-1;
      if(broi!==aroi)return broi-aroi;
    }
    return b.fit.score-a.fit.score;
  });
}

function offerCashValue(o){
  const unit=String(o.unit||'').toLowerCase();
  const isPointOffer=!!pointCurrency(o);
  const fixedCash=(!isPointOffer && unit.includes('cash')) ? Number(o.bonus||0) : 0;
  return fixedCash + Number(o.bonusCashExtra||0);
}
function offerEstimatedSubValue(o){
  const unit=String(o.unit||'').toLowerCase();
  const v=bonusValueRange(o);
  const fixedCash=(!v && unit.includes('cash')) ? Number(o.bonus||0) : 0;
  const extraCash=Number(o.bonusCashExtra||0);
  const pointsMid=v?Number(v.mid||0):0;
  return fixedCash + extraCash + pointsMid;
}
function subReturnRange(o){
  const spend=Number(o.spend||0);
  if(!spend)return null;
  const unit=String(o.unit||'').toLowerCase();
  const v=bonusValueRange(o);
  const fixedCash=(!v && unit.includes('cash')) ? Number(o.bonus||0) : 0;
  const extraCash=Number(o.bonusCashExtra||0);
  const lowValue=fixedCash+extraCash+(v?Number(v.low||0):0);
  const highValue=fixedCash+extraCash+(v?Number(v.high||0):0);
  if(!lowValue&&!highValue)return null;
  return {low:lowValue/spend*100,high:highValue/spend*100,mid:((lowValue+highValue)/2)/spend*100,lowValue,highValue};
}
function subReturnText(o){
  const r=subReturnRange(o);
  if(!r)return '';
  const pct=Math.abs(r.low-r.high)<0.05?`${r.low.toFixed(1)}%`:`${r.low.toFixed(1)}%–${r.high.toFixed(1)}%`;
  return `<div class="small" style="margin-top:5px;color:#365d96"><b>sign-up bonus return on required spend:</b> ${pct}</div><div class="small" style="margin-top:2px;color:#667085">Bonus value ÷ required spend. Excludes rewards earned from the purchases themselves, annual fee, credits, and other card benefits.</div>`;
}
function refineTypeMatches(o,type){
  if(!type||type==='all')return true;
  const t=offerTags(o);
  if(type==='cash')return offerCashValue(o)>0||t.cash;
  if(type==='points')return !!pointCurrency(o)||t.points;
  if(type==='hotel')return t.hotel;
  if(type==='airline')return t.airline;
  if(type==='cruise')return t.cruise;
  if(type==='travel')return t.airline||t.hotel||t.cruise||t.premium||t.points;
  if(type==='business')return o.type==='Business';
  if(type==='personal')return o.type==='Personal';
  return true;
}
function catchAllPointsRate(o){
  const n=String(o.name||'').toLowerCase(), cur=pointCurrency(o);
  if(!cur)return null;
  let rate=null,note='';
  if(n.includes('blue business plus')){rate=2;note='2x Membership Rewards on eligible purchases up to the card’s annual cap.'}
  else if(n.includes('venture x')||n.includes('venture business')||n.includes('venture rewards')){rate=2;note='2x Capital One miles on general eligible purchases.'}
  else if(n.includes('double cash')){rate=2;note='2x ThankYou points structure when purchase and payment components are combined.'}
  else if(n.includes('bilt palladium')){rate=2;note='CardPilot tracks this as a strong general-spend Bilt earning card; verify current earning terms.'}
  else if(n.includes('bilt')){rate=1;note='1x Bilt points on general eligible purchases outside bonus categories.'}
  else if(n.includes('freedom unlimited')){rate=1.5;note='1.5x Ultimate Rewards on general eligible purchases.'}
  else if(n.includes('ink business unlimited')){rate=1.5;note='1.5x Ultimate Rewards on general eligible purchases.'}
  else if(n.includes('premium rewards')){const x=bofaOngoingInfo(o);rate=x?.generalRate||1.5;note='Bank of America points on general purchases, including any saved relationship boost.'}
  else if(n.includes('active cash'))return null;
  else if((o.tags||[]).map(x=>String(x).toLowerCase()).includes('transferable')){rate=1;note='Baseline 1x transferable points on general purchases unless a higher catch-all rate is tracked.'}
  if(rate===null)return null;
  const val=POINT_VALUATIONS[cur];
  const valuePct=val?{low:rate*val.low,high:rate*val.high}:null;
  return {rate,currency:cur,note,valuePct};
}
function keeperScore(o,fit){
  let score=Number(fit?.score||0)*0.45;
  const af=Number(o.af||0), perks=Array.isArray(o.perks)?o.perks.length:0;
  const cash=catchAllCashRate(o)?.effective||0, pts=catchAllPointsRate(o);
  if(af===0)score+=18; else if(af<=95)score+=12; else if(af<=250)score+=5; else if(af>=550)score-=8;
  score+=Math.min(16,cash*5);
  if(pts)score+=Math.min(15,pts.rate*5);
  score+=Math.min(14,perks*2);
  const sig=benefitSignature(o); score+=Object.values(sig).filter(Boolean).length*1.5;
  if((o.tags||[]).map(x=>String(x).toLowerCase()).includes('premium')&&af>395)score+=3;
  return score;
}
function rankingMetric(x,criterion){
  const o=x.offer;
  if(criterion==='bonus')return offerEstimatedSubValue(o);
  if(criterion==='leastspend')return o.spend==null?-Infinity:-Number(o.spend);
  if(criterion==='efficiency')return subReturnRange(o)?.mid||-Infinity;
  if(criterion==='everyday'){
    const type=data.profile.refineType||'all';
    const cash=catchAllCashRate(o)?.effective||0, pts=catchAllPointsRate(o);
    const pointValue=pts?.valuePct?((pts.valuePct.low+pts.valuePct.high)/2):0;
    if(type==='cash')return cash;
    if(type==='points')return pointValue||pts?.rate||0;
    return Math.max(cash,pointValue);
  }
  if(criterion==='keeper')return keeperScore(o,x.fit);
  if(criterion==='overall')return Number(x.fit?.score||0);
  return 0;
}
function priorityList(){
  const p1=data.profile.refinePriority1||data.profile.refineRank||'overall';
  const p2=data.profile.refinePriority2||'';
  const p3=data.profile.refinePriority3||'';
  return [p1,p2,p3].filter(Boolean).filter((v,i,a)=>a.indexOf(v)===i);
}
function refinementCandidates(){
  const type=data.profile.refineType||'all';
  const cardType=data.profile.refineCardType||'all';
  const priorities=priorityList();
  let arr=rankedOffers().filter(x=>!x.fit.disabled&&x.fit.status!=='save'&&refineTypeMatches(x.offer,type)&&(cardType==='all'||x.offer.type===cardType));
  arr.sort((a,b)=>{
    for(const criterion of priorities){
      const av=rankingMetric(a,criterion), bv=rankingMetric(b,criterion);
      if(bv!==av)return bv-av;
    }
    return Number(b.fit?.score||0)-Number(a.fit?.score||0)||offerEstimatedSubValue(b.offer)-offerEstimatedSubValue(a.offer);
  });
  return arr;
}

function officialCardUrl(o){
  if(o.issuerUrl && o.issuerUrlVerified)return {url:o.issuerUrl,exact:true};
  const n=(o.name||'').toLowerCase(), i=(o.issuer||'').toLowerCase();
  if(i.includes('chase')) return {url:'https://creditcards.chase.com/',exact:false};
  if(i.includes('american express')) return {url:'https://www.americanexpress.com/us/credit-cards/',exact:false};
  if(i.includes('capital one')) return {url:'https://www.capitalone.com/credit-cards/',exact:false};
  if(i.includes('citi')) return {url:'https://www.citi.com/credit-cards/',exact:false};
  if(i.includes('bank of america')) return {url:'https://www.bankofamerica.com/credit-cards/',exact:false};
  if(i.includes('wells fargo')) return {url:'https://creditcards.wellsfargo.com/',exact:false};
  if(i.includes('u.s. bank')||i.includes('us bank')) return {url:'https://www.usbank.com/credit-cards.html',exact:false};
  if(i.includes('bilt')) return {url:'https://www.bilt.com/card',exact:false};
  if(i.includes('robinhood')) return {url:'https://robinhood.com/creditcard',exact:false};
  if(i.includes('fidelity')) return {url:'https://www.fidelity.com/spend-save/visa-signature-card',exact:false};

  if(i.includes('discover')) return {url:'https://www.discover.com/credit-cards/',exact:false};
  return null;
}

function refinedRecommendationCard(x,rank){
  const o=x.offer,fit=x.fit;
  const ps=priorityList();
  const badge=rank===1?'Top refined match':rank===2?'Next':'Also consider';
  const metricBits=[];
  for(const mode of ps.slice(0,3)){
    if(mode==='bonus'){const est=offerEstimatedSubValue(o);if(est)metricBits.push(`Estimated sign-up bonus value: ${fmt(Math.round(est))}`);}
    if(mode==='leastspend')metricBits.push(o.spend!=null?`Required spend: ${fmt(Number(o.spend))}`:'Required spend not verified');
    if(mode==='efficiency'){const rr=subReturnRange(o);if(rr)metricBits.push(`Bonus value / required spend: about ${rr.mid.toFixed(1)}%`);}
    if(mode==='everyday'){
      const cash=catchAllCashRate(o),pts=catchAllPointsRate(o),type=data.profile.refineType||'all';
      if(type==='cash'&&cash)metricBits.push(`Catch-all cash back: ${cash.effective.toFixed(3).replace(/0+$/,'').replace(/\.$/,'')}%`);
      else if(type==='points'&&pts)metricBits.push(`Catch-all points: ${pts.rate}x${pts.valuePct?` (~${pts.valuePct.low.toFixed(1)}–${pts.valuePct.high.toFixed(1)}% estimated value)`:''}`);
      else if(cash||pts){const c=cash?`${cash.effective.toFixed(3).replace(/0+$/,'').replace(/\.$/,'')}% cash`:'';const q=pts?`${pts.rate}x points`:'';metricBits.push(`Everyday earning: ${[c,q].filter(Boolean).join(' / ')}`);}
    }
    if(mode==='keeper')metricBits.push(`Keeper score emphasizes ongoing value, useful benefits, earning power, and annual-fee economics.`);
  }
  const metric=metricBits.length?`<div class="small" style="margin-top:7px;color:#365d96"><b>Why it ranks here:</b> ${metricBits.join(' • ')}</div>`:'';
  return `<div class="item" style="${rank===1?'border:2px solid #1f6fff;':''}"><div class="between"><div style="display:flex;gap:10px;align-items:flex-start"><span class="stepdot" style="flex:0 0 auto">${rank}</span><div><div class="item-title">${o.name}</div><div class="meta">${o.issuer||''}${o.issuer?' • ':''}${o.type} • AF ${fmt(o.af)} • ${currentSpendLabel(o)}</div></div></div><span class="pill green">${badge}</span></div><div class="between" style="margin-top:9px"><b>${currentOfferLabel(o)}</b><div class="small">${historicalOfferText(o)}</div></div>${bonusValueText(o)}${subReturnText(o)}${catchAllCashText(o)}${personalReportingWarningHTML(o)}${perksHTML(o)}${metric}<button class="btn ghost" style="margin-top:9px" onclick="whyOffer(${o.id})">Why this card?</button>${issuerLinkHTML(o)}<div class="small" style="margin-top:7px">${o.verified?'Verified '+o.verifiedDate:'Needs verification'}</div></div>`;
}

  return `<div class="welcome"><div class="small">MORE</div><h2>Strategy & settings</h2><p>Advanced tools stay here so the main CardPilot experience stays simple.</p></div><div class="more-list" style="margin-top:14px">
  <button class="more-row" onclick="showView('relationshipsView')"><span><b>Banking & investment relationships</b><span>BofA/Merrill, Citi, Schwab, Morgan Stanley, Bilt, Robinhood, and more.</span></span><span class="more-arrow">›</span></button>
  <button class="more-row" onclick="showView('benefitsView')"><span><b>Benefits & saved strategies</b><span>Companion benefits, expiration dates, and saved timing strategies.</span></span><span class="more-arrow">›</span></button>
  <button class="more-row" onclick="openPreferencePicker()"><span><b>Advanced preferences</b><span>5/24 preservation, spend limits, reward categories, overlap, and eligibility.</span></span><span class="more-arrow">›</span></button>
  <button class="more-row" onclick="browseCards()"><span><b>Browse all cards</b><span>Search the full CardPilot market database.</span></span><span class="more-arrow">›</span></button>
  </div><div class="card" style="margin-top:14px"><div class="small">DATA</div><h3 style="margin-top:4px">CardPilot market catalog</h3><div class="small">${data.offers.length} cards loaded • catalog ${data.catalogVersion||CATALOG_VERSION}. Current offers and issuer links are maintained separately from the UI.</div></div>`;
}

function render(){
  $('#homeView').innerHTML=home();
  $('#cardsView').innerHTML=cards();
  try{$('#applyView').innerHTML=apply();}catch(e){console.error('Apply Next render error',e);$('#applyView').innerHTML=`<div class=\"card\"><h3>We hit a recommendation error</h3><div class=\"small\">${String(e&&e.message||e)}</div><button class=\"btn ghost\" style=\"margin-top:10px\" onclick=\"restartSetup()\">Review preferences</button></div>`;}
  $('#offersView').innerHTML=offers();
  $('#benefitsView').innerHTML=benefits();
  $('#relationshipsView').innerHTML=relationshipsPage();
  $('#moreView').innerHTML=morePage();
}
function showView(id,preserveScroll=false){const y=window.scrollY;$$('main section').forEach(s=>s.classList.add('hidden')); $('#'+id).classList.remove('hidden'); $$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===id)); const titles={homeView:'CardPilot',cardsView:'My Cards',applyView:'Find a Card',offersView:'Browse Cards',benefitsView:'Benefits & Strategies',relationshipsView:'Relationships',moreView:'More'}; $('#title').textContent=titles[id]||'CardPilot'; if(preserveScroll){requestAnimationFrame(()=>window.scrollTo(0,y));}else{window.scrollTo(0,0)}}
$$('.tab[data-view]').forEach(t=>t.onclick=()=>t.dataset.view==='applyView'?openFindFlow():showView(t.dataset.view));
async function loadCatalog(){
  try{
    const r=await fetch('cards.json?v='+encodeURIComponent(CATALOG_VERSION),{cache:'no-store'});
    if(!r.ok) throw new Error('cards.json HTTP '+r.status);
    const payload=await r.json();
    if(!payload||!Array.isArray(payload.cards)) throw new Error('Invalid cards.json');
    BUSINESS_CATALOG=payload.cards.filter(c=>c.type==='Business');
    PERSONAL_CATALOG=payload.cards.filter(c=>c.type==='Personal');
    if(payload.catalogVersion) data.catalogSourceVersion=payload.catalogVersion;
    migrateV8();
    data.catalogLoadStatus='live';
  }catch(e){
    console.error('Catalog load failed',e);
    data.catalogLoadStatus='fallback';
    if(!Array.isArray(data.offers)||!data.offers.length){
      alert('CardPilot could not load the card catalog. Please reconnect and refresh.');
    }
  }
}
async function bootstrap(){
  await loadCatalog();
  // A fresh page load always starts on the Home dashboard. Find-a-Card questions are entered only by an explicit user action.
  setSearchMode('idle');
  data.profile.editingPreferences=false;
  data.profile.showRecommendation=false;
  delete data.profile.postSetupTarget;
  localStorage.setItem('cardpilotData',JSON.stringify(data));
  render();
  showView('homeView')
  if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});if(window.caches){caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))).catch(()=>{});}}
}
bootstrap();
</script>
</body></html>
