<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0d2743" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>CardPilot MVP v5</title>
  <style>
    :root{--navy:#0d2743;--blue:#1769ff;--bg:#f4f7fb;--card:#fff;--text:#162233;--muted:#667085;--green:#19a35b;--amber:#d97706;--red:#d92d20;--line:#e6eaf0}
    *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--text)}
    .app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:88px}.top{background:linear-gradient(135deg,#0d2743,#12395f);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 20px;position:sticky;top:0;z-index:3}.top h1{font-size:23px;margin:0}.sub{font-size:13px;opacity:.82;margin-top:4px}
    .content{padding:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;box-shadow:0 2px 10px rgba(16,24,40,.05)}.card h3{margin:0 0 5px;font-size:15px}.big{font-size:26px;font-weight:800}.small{font-size:12px;color:var(--muted)}.section{margin:18px 0 8px;font-size:17px;font-weight:800}.row{display:flex;gap:12px;align-items:center}.between{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px;font-weight:700}.green{background:#e9f8ef;color:#087a3f}.amber{background:#fff4dd;color:#9a5b00}.red{background:#feeceb;color:#b42318}.blue{background:#eaf1ff;color:#175cd3}.progress{height:9px;background:#e9edf3;border-radius:99px;overflow:hidden}.bar{height:100%;background:var(--green)}
    button,.btn{border:none;border-radius:12px;padding:11px 13px;font-weight:700;background:var(--blue);color:#fff;cursor:pointer}.btn.secondary{background:#eef4ff;color:#175cd3}.btn.ghost{background:#fff;color:#344054;border:1px solid var(--line)}input,select{width:100%;padding:11px 12px;border:1px solid #d0d5dd;border-radius:10px;background:#fff;font:inherit}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field{min-width:0}.field-label{display:block;font-size:12px;color:#98a2b3;margin:0 0 4px 3px}.namebox{width:100%;min-height:48px;resize:vertical;padding:11px 12px;border:1px solid #d0d5dd;border-radius:10px;background:#fff;font:inherit;line-height:1.25}.card-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:10px}.help{font-size:11px;color:#667085;margin-top:5px;line-height:1.35}.subbox{margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}.list{display:flex;flex-direction:column;gap:10px}.item{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}.item-title{font-weight:800}.meta{color:var(--muted);font-size:12px;margin-top:3px}.tabs{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:auto;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:5}.tab{background:none;color:#667085;padding:7px 4px;font-size:11px}.tab.active{color:var(--blue)}.tab span{display:block;font-size:18px;margin-bottom:2px}.hidden{display:none}.kpi{font-weight:800;font-size:18px}.right{text-align:right}.note{background:#fff8e6;border:1px solid #f5d78e;padding:11px;border-radius:12px;font-size:12px}.empty{color:var(--muted);text-align:center;padding:30px 10px}.link{color:var(--blue);font-weight:700;cursor:pointer}.danger{color:var(--red)}.hero{background:linear-gradient(135deg,#eef4ff,#fff);border:1px solid #d7e4ff;border-radius:18px;padding:18px;margin-bottom:14px}.hero h2{margin:0 0 6px;font-size:22px}.stepdot{width:28px;height:28px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:#eaf1ff;color:#175cd3;font-weight:800;flex:0 0 auto}.choicegrid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.choice{background:#fff;color:#344054;border:1px solid #d0d5dd;text-align:left}.choice.selected{border-color:#1769ff;background:#eef4ff;color:#175cd3}.setup-progress{height:6px;background:#e9edf3;border-radius:99px;overflow:hidden;margin:10px 0 18px}.setup-progress>div{height:100%;background:#1769ff}.todo{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-top:1px solid var(--line)}.todo:first-of-type{border-top:none}.primary-action{font-size:18px;padding:14px 16px;width:100%;margin-top:12px}.recap{background:linear-gradient(135deg,#eef8ff,#fff);border:1px solid #cfe3ff;border-radius:18px;padding:18px;margin-bottom:14px}.recap h2{margin:0 0 5px;font-size:22px}.rec-row{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-top:1px solid #e6eef9}.rec-row:first-of-type{border-top:none}.rec-num{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:#1769ff;color:#fff;font-weight:800;flex:0 0 auto}.rec-title{font-weight:800}.rec-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}
  </style>
</head>
<body>
<div class="app">
  <header class="top"><h1 id="title">CardPilot</h1><div class="sub" id="subtitle">Smarter card decisions, without wasting a 5/24 slot.</div></header>
  <main class="content">
    <section id="homeView"></section>
    <section id="cardsView" class="hidden"></section>
    <section id="applyView" class="hidden"></section>
    <section id="offersView" class="hidden"></section>
    <section id="benefitsView" class="hidden"></section>
  </main>
  <nav class="tabs">
    <button class="tab active" data-view="homeView"><span>⌂</span>Home</button>
    <button class="tab" data-view="cardsView"><span>▣</span>My Cards</button>
    <button class="tab" data-view="applyView"><span>✈</span>Apply Next</button>
    <button class="tab" data-view="offersView"><span>★</span>Offers</button>
    <button class="tab" data-view="benefitsView"><span>◷</span>Benefits</button>
  </nav>
</div>
<script>
const $=s=>document.querySelector(s); const $$=s=>[...document.querySelectorAll(s)];
const defaultData={
  profile:{five24Goal:true,cpTargetYear:2028,businessFirst:true,maxSpend:8000,notes:'Preserve both Southwest business cards for late 2027; target bonuses posting in early 2028.'},
  cards:[
    {id:1,name:'Amex Business Gold',type:'Business',opened:'2026-08-14',af:375,reports:false,sub:{bonus:'Welcome bonus',need:15000,done:8300,due:'2026-11-22',active:true}},
    {id:2,name:'Atmos Rewards Business',type:'Business',opened:'2026-06-03',af:95,reports:false},
    {id:3,name:'Chase Ink Unlimited',type:'Business',opened:'2026-03-07',af:0,reports:false},
    {id:4,name:'Southwest Rapid Rewards Personal',type:'Personal',opened:'2024-01-12',af:149,reports:true},
    {id:5,name:'Chase Sapphire Preferred',type:'Personal',opened:'2023-09-20',af:95,reports:true},
    {id:6,name:'Hilton Honors Personal',type:'Personal',opened:'2023-05-06',af:0,reports:true}
  ],
  expenses:[
    {id:1,name:'Insurance premium',amount:6700,date:'2026-10-15',fee:0,assigned:'Amex Business Gold'}
  ],
  benefits:[
    {id:1,name:'Atmos companion certificate #1',expires:'2027-01-09',value:'$99 companion fare'},
    {id:2,name:'Atmos companion certificate #2',expires:'2027-02-03',value:'$99 companion fare'},
    {id:3,name:'Southwest Companion Pass',expires:'2027-02-28',value:'Companion Pass'}
  ],
  offers:[
    {id:1,name:'World of Hyatt Business',type:'Business',bonus:70000,unit:'Hyatt points',hist:80000,spend:7000,af:199,reports:false,status:'wait',reason:'Current offer is below historical high.'},
    {id:2,name:'Citi AAdvantage Business',type:'Business',bonus:75000,unit:'AA miles',hist:75000,spend:5000,af:99,reports:false,status:'consider',reason:'Useful when offer is elevated; preserves personal slots.'},
    {id:3,name:'Southwest Premier Business',type:'Business',bonus:80000,unit:'RR points',hist:120000,spend:3000,af:149,reports:false,status:'save',reason:'Save for late 2027 Companion Pass strategy.'},
    {id:4,name:'Southwest Performance Business',type:'Business',bonus:80000,unit:'RR points',hist:120000,spend:5000,af:299,reports:false,status:'save',reason:'Save for late 2027 Companion Pass strategy.'},
    {id:5,name:'U.S. Bank Triple Cash Business',type:'Business',bonus:750,unit:'cash',hist:750,spend:6000,af:0,reports:false,status:'consider',reason:'Low annual fee and spend requirement fits many organic expenses.'},
    {id:6,name:'Carnival Rewards Mastercard',type:'Personal',bonus:50000,unit:'points',hist:50000,spend:1000,af:0,reports:true,status:'avoid',reason:'Uses a personal 5/24 slot.'}
  ]
};
let data=JSON.parse(localStorage.getItem('cardpilotData')||'null')||defaultData;
function save(){localStorage.setItem('cardpilotData',JSON.stringify(data)); render();}
function fmt(n){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(n)}
function daysTo(d){return Math.ceil((new Date(d+'T12:00:00')-new Date())/86400000)}
function five24(){const cutoff=new Date(); cutoff.setMonth(cutoff.getMonth()-24); return data.cards.filter(c=>c.type==='Personal'&&counts524(c)&&new Date(c.opened)>=cutoff).length}
function activeSub(){return data.cards.find(c=>c.sub&&c.sub.active)}
function pct(a,b){return b?Math.min(100,Math.round(a/b*100)):0}
function counts524(c){if(c.five24Override==='count')return true;if(c.five24Override==='nocount')return false;return !!c.reports}
function five24Label(c){if(c.five24Override==='count')return 'Counts 5/24';if(c.five24Override==='nocount')return 'No 5/24';return counts524(c)?'May count 5/24':'No 5/24'}
function setupComplete(){return !!data.profile.setupComplete}
function setupNeeds(){const needs=[];if(!data.cards.length)needs.push('Add the cards you already have');if(data.profile.maxSpend===undefined||data.profile.maxSpend===null)needs.push('Tell us your expected 3-month spending');if(data.profile.businessFirst===undefined)needs.push('Tell us whether business cards are an option');return needs}
function nextAction(){const s=activeSub();if(s){const rem=Math.max(0,s.sub.need-s.sub.done);const matching=data.expenses.find(e=>e.amount>=rem);return {title:`Finish ${s.name} SUB`,detail:`${fmt(rem)} remaining${s.sub.due?` • due ${s.sub.due}`:''}`,why:matching?`${matching.name} (${fmt(matching.amount)}) can cover the remaining requirement.`:'Finish the current bonus before taking on another spend requirement.'}}
const exp=[...data.benefits].filter(b=>b.expires).sort((a,b)=>new Date(a.expires)-new Date(b.expires))[0];if(exp&&daysTo(exp.expires)<=90)return {title:`Use ${exp.name}`,detail:`Expires in ${daysTo(exp.expires)} days`,why:'An expiring benefit is more urgent than opening another card.'};return {title:'Review Apply Next',detail:'No active SUB is blocking a new application.',why:'CardPilot can compare your tracked offers against your spend, 5/24 position, and saved strategies.'}}
function onboarding(){const step=+(data.profile.setupStep||1);const pctv=Math.round(step/5*100);let body='';
if(step===1)body=`<div class="card"><div class="row"><span class="stepdot">1</span><div><h3>Add the cards you already have</h3><div class="small">CardPilot uses account-open dates to calculate 5/24 and avoid bad application timing.</div></div></div><div style="margin-top:12px" class="small">You currently have <b>${data.cards.length}</b> cards saved. You can edit them now or continue and review them later.</div><div class="row" style="margin-top:12px"><button onclick="finishSetupStep(2);showView('cardsView')">Review my cards</button><button class="btn ghost" onclick="finishSetupStep(2)">Continue</button></div></div>`;
if(step===2)body=`<div class="card"><div class="row"><span class="stepdot">2</span><div><h3>Are you working on a welcome bonus?</h3><div class="small">We'll prioritize finishing an active SUB before suggesting another one.</div></div></div><div class="choicegrid" style="margin-top:14px"><button class="choice" onclick="finishSetupStep(3)">No active SUB</button><button class="choice" onclick="finishSetupStep(3);showView('cardsView')">Yes — review it</button></div></div>`;
if(step===3)body=`<div class="card"><div class="row"><span class="stepdot">3</span><div><h3>Normal spending in the next 3 months</h3><div class="small">This keeps CardPilot from recommending a bonus whose minimum spend doesn't fit your life.</div></div></div><div class="choicegrid" style="margin-top:14px">${[3000,5000,8000,10000].map(v=>`<button class="choice ${data.profile.maxSpend===v?'selected':''}" onclick="setSpend(${v})">${fmt(v)}${v===10000?' +':''}</button>`).join('')}</div></div>`;
if(step===4)body=`<div class="card"><div class="row"><span class="stepdot">4</span><div><h3>What matters most?</h3><div class="small">Choose the goal CardPilot should protect when sequencing applications.</div></div></div><div class="choicegrid" style="margin-top:14px">${['Maximum SUBs','Travel points','Cash back','Southwest Companion Pass','Hotel nights / status','Help me decide'].map(g=>`<button class="choice ${data.profile.goal===g?'selected':''}" onclick="setGoal('${g.replaceAll("'","\\'")}')">${g}</button>`).join('')}</div></div>`;
if(step===5)body=`<div class="card"><div class="row"><span class="stepdot">5</span><div><h3>Are business cards an option?</h3><div class="small">This can materially change application sequencing and may help preserve personal 5/24 slots.</div></div></div><div class="choicegrid" style="margin-top:14px"><button class="choice" onclick="finishOnboarding(false)">Personal cards only</button><button class="choice" onclick="finishOnboarding(true)">Yes, include business cards</button></div></div>`;
return `<div class="hero"><h2>Welcome to CardPilot</h2><div class="small">We'll figure out what credit card makes sense next — and when.</div><div class="setup-progress"><div style="width:${pctv}%"></div></div><b>Setup ${step} of 5</b></div>${body}`}
function finishSetupStep(n){data.profile.setupStep=n;localStorage.setItem('cardpilotData',JSON.stringify(data));render();showView('homeView')}
function setSpend(v){data.profile.maxSpend=v;finishSetupStep(4)}
function setGoal(g){data.profile.goal=g;finishSetupStep(5)}
function finishOnboarding(biz){data.profile.businessFirst=biz;data.profile.setupComplete=true;data.profile.setupStep=5;data.profile.showRecommendation=true;save();showView('homeView')}
function restartSetup(){data.profile.setupComplete=false;data.profile.setupStep=1;save();showView('homeView')}
function recommendationPlan(){
  const s=activeSub();
  const f=five24();
  const max=data.profile.maxSpend||8000;
  const goal=data.profile.goal||'Help me decide';
  const preserveSouthwest=!!data.profile.cpTargetYear;
  const candidates=data.offers.filter(o=>o.status==='consider' && o.spend<=max && (!data.profile.businessFirst || o.type==='Business'));
  const waits=data.offers.filter(o=>o.status==='wait' && o.spend<=max && (!data.profile.businessFirst || o.type==='Business'));
  const best=candidates[0]||waits[0]||data.offers.find(o=>o.spend<=max)||null;
  const steps=[];
  if(s){const rem=Math.max(0,s.sub.need-s.sub.done);steps.push({title:`Finish ${s.name} first`,detail:`${fmt(rem)} remains${s.sub.due?` before ${s.sub.due}`:''}. CardPilot will not put another minimum-spend target ahead of this one.`});}
  if(best){steps.push({title:`${s?'Then consider':'Consider'} ${best.name}`,detail:`Tracked offer: ${best.bonus.toLocaleString()} ${best.unit}; spend ${fmt(best.spend)}; annual fee ${fmt(best.af)}. ${best.reason}`});}
  if(preserveSouthwest){steps.push({title:'Preserve the Southwest business cards',detail:`Keep them available for the ${data.profile.cpTargetYear} Companion Pass strategy rather than using them now.`});}
  if(f>=4){steps.push({title:'Protect your remaining 5/24 capacity',detail:`You are currently ${f}/24 based on saved accounts. Favor business-card opportunities when appropriate.`});}
  else if(data.profile.businessFirst){steps.push({title:'Use business cards strategically',detail:`Your setup says business cards are an option. This can preserve personal-card capacity while you pursue bonuses.`});}
  if(goal==='Southwest Companion Pass' && !preserveSouthwest){steps.push({title:'Build a Companion Pass timeline',detail:'CardPilot should sequence Southwest applications so qualifying points post in the intended calendar year.'});}
  return {steps,best,goal,f};
}
function recommendationScreen(){
  const p=recommendationPlan();
  const headline=activeSub()?'Finish your current SUB before opening another card':p.best?`Next card to review: ${p.best.name}`:'Your strategy is ready';
  return `<div class="recap"><div class="small">YOUR CARDPILOT PLAN</div><h2>${headline}</h2><div class="small">Based on your cards, ${p.f}/24 status, spending limit, goal (${p.goal}), and business-card preference.</div>${p.steps.map((x,i)=>`<div class="rec-row"><div class="rec-num">${i+1}</div><div><div class="rec-title">${x.title}</div><div class="small" style="margin-top:3px">${x.detail}</div></div></div>`).join('')}<div class="rec-actions"><button onclick="data.profile.showRecommendation=false;save();showView('homeView')">Go to dashboard</button><button class="btn ghost" onclick="data.profile.showRecommendation=false;save();showView('applyView')">See all options</button></div></div>`
}

function home(){if(!setupComplete())return onboarding();if(data.profile.showRecommendation)return recommendationScreen();const s=activeSub(),f=five24(),exp=[...data.benefits].filter(b=>b.expires).sort((a,b)=>new Date(a.expires)-new Date(b.expires))[0],rem=s?Math.max(0,s.sub.need-s.sub.done):0,action=nextAction(),needs=setupNeeds();
return `<div class="hero"><div class="small">WHAT SHOULD I DO NOW?</div><h2>${action.title}</h2><div>${action.detail}</div><div class="small" style="margin-top:8px"><b>Why:</b> ${action.why}</div>${s?`<button class="primary-action" onclick="showView('cardsView')">Update SUB progress</button>`:`<button class="primary-action" onclick="showView('applyView')">Show me what to consider</button>`}</div>
${needs.length?`<div class="note"><b>CardPilot needs ${needs.length} more thing${needs.length>1?'s':''} from you.</b>${needs.map(x=>`<div class="todo"><span class="stepdot">›</span><span>${x}</span></div>`).join('')}</div>`:''}
<div class="grid" style="margin-top:14px"><div class="card"><div class="small">Chase 5/24</div><div class="big">${data.cards.length?f+'/24':'—'}</div><div class="small">${data.cards.length?Math.max(0,5-f)+' slots before 5/24':'Finish card setup'}</div></div><div class="card"><div class="small">Active SUB</div><div class="kpi">${s?s.name:'None'}</div><div class="small">${s?fmt(rem)+' remaining':'No active bonus'}</div></div><div class="card"><div class="small">Strategy</div><div class="kpi">${data.profile.businessFirst?'Business first':'Personal + business'}</div><div class="small">Goal: ${data.profile.goal||'Not set'}</div></div><div class="card"><div class="small">Expiring soon</div><div class="kpi">${exp?daysTo(exp.expires)+' days':'—'}</div><div class="small">${exp?exp.name:'No benefit added'}</div></div></div>
${s?`<div class="section">SUB progress</div><div class="card"><div class="between"><div><h3>${s.name}</h3><div class="small">Due ${s.sub.due||'not set'}</div></div><span class="pill green">Active</span></div><div style="margin-top:12px" class="progress"><div class="bar" style="width:${pct(s.sub.done,s.sub.need)}%"></div></div><div class="between" style="margin-top:8px"><b>${fmt(s.sub.done)} / ${fmt(s.sub.need)}</b><span class="small">${pct(s.sub.done,s.sub.need)}%</span></div></div>`:''}
<div class="section">Upcoming spend</div><div class="list">${data.expenses.map(e=>`<div class="item between"><div><div class="item-title">${e.name}</div><div class="meta">${e.date}${e.assigned?` • Assigned: ${e.assigned}`:''}</div></div><div class="right"><div class="kpi">${fmt(e.amount)}</div><div class="small">${s&&e.amount>=rem?'Can finish active SUB':''}</div></div></div>`).join('')||'<div class="empty">No upcoming expenses added.</div>'}</div><div style="text-align:center;margin-top:16px"><button class="btn ghost" onclick="restartSetup()">Review setup</button></div>`}

function cards(){return `<div class="between" style="justify-content:flex-end;margin-bottom:10px"><button onclick="showAddCard()">+ Add</button></div><div id="addCardBox"></div><div class="list">${data.cards.map(c=>`<div class="item"><div class="between"><div style="min-width:0"><div class="item-title" style="overflow-wrap:anywhere">${c.name}</div><div class="meta">${c.type} • Account opened ${c.opened} • AF ${fmt(c.af)}</div></div><span class="pill ${counts524(c)?'amber':'green'}">${five24Label(c)}</span></div>${c.sub&&c.sub.active?`<div style="margin-top:10px" class="progress"><div class="bar" style="width:${pct(c.sub.done,c.sub.need)}%"></div></div><div class="small" style="margin-top:5px">SUB: ${fmt(Math.max(0,c.sub.need-c.sub.done))} remaining</div><button class="btn secondary" style="margin-top:8px;padding:7px 9px" onclick="addSpendToSub(${c.id})">+ SUB spend</button>`:''}<div class="card-actions"><button class="btn ghost" style="padding:7px 10px" onclick="showEditCard(${c.id})">Edit</button><button class="btn ghost danger" style="padding:7px 10px" onclick="removeCard(${c.id})">Remove</button></div></div>`).join('')}</div>`}
function showAddCard(){const box=$('#addCardBox'); if(!box)return; box.innerHTML=`<div class="card" style="margin-bottom:12px"><h3>Add card</h3><div class="formgrid"><div class="field"><label class="field-label" for="cn">Card name</label><textarea class="namebox" id="cn" placeholder="Card name"></textarea></div><div class="field"><label class="field-label" for="ct">Card type</label><select id="ct"><option>Business</option><option>Personal</option></select></div><div class="field"><label class="field-label" for="caf">Annual fee</label><input id="caf" type="number" placeholder="Annual fee"></div><div class="field"><label class="field-label" for="co">Account open date</label><input id="co" type="date" aria-label="Account open date"></div></div><div class="subbox"><label class="field-label" for="c524">5/24 treatment</label><select id="c524"><option value="auto">Auto / based on reporting</option><option value="count">Force: counts toward 5/24</option><option value="nocount">Force: does not count toward 5/24</option></select><label class="small" style="display:block;margin:10px 0"><input id="cr" type="checkbox" style="width:auto"> Reports as personal account</label><div class="help">Use the override only when you know this account should be treated differently. CardPilot uses the account-open date when calculating the rolling 24-month window.</div></div><div class="subbox"><label class="small"><input id="csubactive" type="checkbox" style="width:auto" onchange="toggleAddSubFields()"> Track an active SUB</label><div id="addSubFields" class="hidden" style="margin-top:10px"><div class="formgrid"><div class="field"><label class="field-label" for="csbonus">SUB amount / description</label><input id="csbonus" placeholder="e.g. 100,000 points"></div><div class="field"><label class="field-label" for="csneed">Spend requirement</label><input id="csneed" type="number" placeholder="Minimum spend"></div><div class="field"><label class="field-label" for="csdone">Spend completed</label><input id="csdone" type="number" placeholder="Spent so far"></div><div class="field"><label class="field-label" for="csdue">SUB deadline</label><input id="csdue" type="date"></div></div></div></div><button style="margin-top:12px" onclick="addCard()">Save card</button></div>`}
function toggleAddSubFields(){const el=$('#addSubFields');if(el)el.classList.toggle('hidden',!$('#csubactive').checked)}
function addCard(){const n=$('#cn').value.trim(); if(!n)return;const card={id:Date.now(),name:n,type:$('#ct').value,opened:$('#co').value||new Date().toISOString().slice(0,10),af:+$('#caf').value||0,reports:$('#cr').checked,five24Override:$('#c524').value};if($('#csubactive').checked){card.sub={bonus:$('#csbonus').value.trim()||'Welcome bonus',need:+$('#csneed').value||0,done:+$('#csdone').value||0,due:$('#csdue').value,active:true}}data.cards.push(card); save(); showView('cardsView')}
function showEditCard(id){const c=data.cards.find(x=>x.id===id);if(!c)return;const box=$('#addCardBox');if(!box)return;const sub=c.sub||{bonus:'',need:0,done:0,due:'',active:false};box.innerHTML=`<div class="card" style="margin-bottom:12px"><h3>Edit card</h3><div class="formgrid"><div class="field"><label class="field-label" for="ecn">Card name</label><textarea class="namebox" id="ecn">${c.name}</textarea></div><div class="field"><label class="field-label" for="ect">Card type</label><select id="ect"><option ${c.type==='Business'?'selected':''}>Business</option><option ${c.type==='Personal'?'selected':''}>Personal</option></select></div><div class="field"><label class="field-label" for="ecaf">Annual fee</label><input id="ecaf" type="number" value="${c.af||0}" placeholder="Annual fee"></div><div class="field"><label class="field-label" for="eco">Account open date</label><input id="eco" type="date" value="${c.opened||''}" aria-label="Account open date"></div></div><div class="subbox"><label class="field-label" for="ec524">5/24 treatment</label><select id="ec524"><option value="auto" ${(c.five24Override||'auto')==='auto'?'selected':''}>Auto / based on reporting</option><option value="count" ${c.five24Override==='count'?'selected':''}>Force: counts toward 5/24</option><option value="nocount" ${c.five24Override==='nocount'?'selected':''}>Force: does not count toward 5/24</option></select><label class="small" style="display:block;margin:10px 0"><input id="ecr" type="checkbox" style="width:auto" ${c.reports?'checked':''}> Reports as personal account</label><div class="help">Current CardPilot treatment: <b>${five24Label(c)}</b>. Use the override if you need to correct the automatic treatment.</div></div><div class="subbox"><label class="small"><input id="esactive" type="checkbox" style="width:auto" ${sub.active?'checked':''} onchange="toggleEditSubFields()"> Track an active SUB</label><div id="editSubFields" class="${sub.active?'':'hidden'}" style="margin-top:10px"><div class="formgrid"><div class="field"><label class="field-label" for="esbonus">SUB amount / description</label><input id="esbonus" value="${sub.bonus||''}" placeholder="e.g. 100,000 points"></div><div class="field"><label class="field-label" for="esneed">Spend requirement</label><input id="esneed" type="number" value="${sub.need||0}" placeholder="Minimum spend"></div><div class="field"><label class="field-label" for="esdone">Spend completed</label><input id="esdone" type="number" value="${sub.done||0}" placeholder="Spent so far"></div><div class="field"><label class="field-label" for="esdue">SUB deadline</label><input id="esdue" type="date" value="${sub.due||''}"></div></div></div></div><div class="row" style="margin-top:12px"><button onclick="saveCardEdit(${c.id})">Save changes</button><button class="btn ghost" onclick="clearCardEditor()">Cancel</button></div></div>`;box.scrollIntoView({behavior:'smooth',block:'start'})}
function toggleEditSubFields(){const el=$('#editSubFields');if(el)el.classList.toggle('hidden',!$('#esactive').checked)}
function clearCardEditor(){const box=$('#addCardBox');if(box)box.innerHTML=''}
function saveCardEdit(id){const c=data.cards.find(x=>x.id===id);if(!c)return;c.name=$('#ecn').value.trim()||c.name;c.type=$('#ect').value;c.af=+$('#ecaf').value||0;c.opened=$('#eco').value||c.opened;c.reports=$('#ecr').checked;c.five24Override=$('#ec524').value;if($('#esactive').checked){c.sub={bonus:$('#esbonus').value.trim()||'Welcome bonus',need:+$('#esneed').value||0,done:+$('#esdone').value||0,due:$('#esdue').value,active:true}}else if(c.sub){c.sub.active=false}save();showView('cardsView')}
function removeCard(id){const c=data.cards.find(x=>x.id===id);if(!c)return;if(!confirm(`Remove ${c.name}? This cannot be undone.`))return;data.cards=data.cards.filter(c=>c.id!==id); save(); showView('cardsView')}
function apply(){const s=activeSub(); const affordable=data.offers.filter(o=>o.spend<=(data.profile.maxSpend||8000)); const goal=data.profile.goal||'Not set'; return `<div class="section" style="margin-top:0">Apply Next</div>${s?`<div class="note"><b>Finish your current SUB first.</b><br>${s.name}: ${fmt(s.sub.need-s.sub.done)} remaining before ${s.sub.due}.</div>`:''}<div class="section">For you</div><div class="small" style="margin-bottom:10px">${data.profile.businessFirst?'Business-first mode is on. ':''}${affordable.length} tracked offers fit your ≤${fmt(data.profile.maxSpend||8000)} spend preference. Goal: ${goal}.</div><div class="list">${[...data.offers].sort((a,b)=>({consider:1,wait:2,save:3,avoid:4}[a.status]-({consider:1,wait:2,save:3,avoid:4}[b.status]))).map(o=>offerCard(o,true)).join('')}</div><div class="section">Companion Pass plan</div><div class="card"><h3>Southwest 2028–2029 strategy</h3><div class="small">Preserve both Southwest business cards until late 2027, then time qualifying bonuses to post in 2028. Re-check Chase rules and offers before applying.</div><div style="margin-top:10px"><span class="pill blue">Target: early 2028</span></div></div>`}
function offerCard(o,reason=false){const strength=Math.round(o.bonus/o.hist*100);const cls=o.status==='consider'?'green':o.status==='wait'?'amber':o.status==='save'?'blue':'red'; const label=o.status==='consider'?'Strong candidate':o.status==='wait'?'Wait':o.status==='save'?'Save for later':'Avoid for now'; return `<div class="item"><div class="between"><div><div class="item-title">${o.name}</div><div class="meta">${o.type} • AF ${fmt(o.af)} • Spend ${fmt(o.spend)}</div></div><span class="pill ${cls}">${label}</span></div><div class="between" style="margin-top:9px"><div><b>${o.bonus.toLocaleString()} ${o.unit}</b></div><div class="small">${strength}% of historical high</div></div>${reason?`<div class="small" style="margin-top:7px">${o.reason}</div><button class="btn ghost" style="margin-top:8px;padding:7px 10px" onclick="whyOffer(${o.id})">Why?</button>`:''}</div>`}

function whyOffer(id){const o=data.offers.find(x=>x.id===id);if(!o)return;const reasons=[];const s=activeSub();reasons.push('CardPilot first checks active SUBs, 5/24 impact, business-card preference, spend fit, offer strength, and any strategy you are preserving.');if(s)reasons.push(`You have an active SUB on ${s.name}.`);if(data.profile.businessFirst&&o.type==='Business')reasons.push('Business-first mode is on, so this may preserve a personal 5/24 slot.');if(data.profile.businessFirst&&o.type==='Personal')reasons.push('This is a personal card and may use a 5/24 slot.');if(o.spend>(data.profile.maxSpend||8000))reasons.push(`Its ${fmt(o.spend)} spend requirement exceeds your preferred ${fmt(data.profile.maxSpend||8000)} maximum.`);else reasons.push(`Its ${fmt(o.spend)} spend requirement fits your current spend setting.`);if(o.hist&&o.bonus<o.hist)reasons.push(`The tracked offer is below the historical high (${o.bonus.toLocaleString()} vs ${o.hist.toLocaleString()}).`);if(o.name.includes('Southwest')&&data.profile.cpTargetYear)reasons.push(`Your strategy preserves Southwest business-card opportunities for the ${data.profile.cpTargetYear} Companion Pass plan.`);reasons.push(o.reason);alert(reasons.join('\n\n'))}

function offers(){return `<div class="section" style="margin-top:0">Current & historical offers</div><div class="note">MVP note: offers below are sample data. In production, connect this screen to a verified offer database and source URLs.</div><div class="list" style="margin-top:12px">${data.offers.map(o=>offerCard(o,true)).join('')}</div>`}
function benefits(){const sorted=[...data.benefits].sort((a,b)=>new Date(a.expires)-new Date(b.expires));return `<div class="between"><div class="section" style="margin-top:0">Benefits</div><button onclick="showAddBenefit()">+ Add</button></div><div id="addBenefitBox"></div><div class="list">${sorted.map(b=>`<div class="item between"><div><div class="item-title">${b.name}</div><div class="meta">${b.value||''} • Expires ${b.expires}</div></div><span class="pill ${daysTo(b.expires)<60?'red':daysTo(b.expires)<120?'amber':'green'}">${daysTo(b.expires)} days</span></div>`).join('')||'<div class="empty">No benefits tracked yet.</div>'}</div><div class="section">Upcoming spend</div><div class="card"><h3>Add an expense</h3><div class="formgrid"><input id="en" placeholder="Expense name"><input id="ea" type="number" placeholder="Amount"><input id="ed" type="date"><input id="ef" type="number" step="0.1" placeholder="Card fee %"><select id="eas"><option value="">Unassigned</option>${data.cards.map(c=>`<option>${c.name}</option>`).join('')}</select></div><button style="margin-top:10px" onclick="addExpense()">Save expense</button></div>`}
function showAddBenefit(){const box=$('#addBenefitBox'); if(!box)return; box.innerHTML=`<div class="card" style="margin-bottom:12px"><h3>Add benefit</h3><div class="formgrid"><input id="bn" placeholder="Benefit name"><input id="bv" placeholder="Value / note"><input id="be" type="date"></div><button style="margin-top:10px" onclick="addBenefit()">Save benefit</button></div>`}
function addBenefit(){if(!$('#bn').value)return; data.benefits.push({id:Date.now(),name:$('#bn').value,value:$('#bv').value,expires:$('#be').value}); save(); showView('benefitsView')}
function addExpense(){if(!$('#en').value||!$('#ea').value)return; data.expenses.push({id:Date.now(),name:$('#en').value,amount:+$('#ea').value,date:$('#ed').value,fee:+$('#ef').value||0,assigned:$('#eas')?$('#eas').value:''}); save(); showView('benefitsView')}
function render(){ $('#homeView').innerHTML=home(); $('#cardsView').innerHTML=cards(); $('#applyView').innerHTML=apply(); $('#offersView').innerHTML=offers(); $('#benefitsView').innerHTML=benefits(); }
function showView(id){$$('main section').forEach(s=>s.classList.add('hidden')); $('#'+id).classList.remove('hidden'); $$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===id)); const titles={homeView:'CardPilot',cardsView:'My Cards',applyView:'Apply Next',offersView:'Offers',benefitsView:'Benefits'}; $('#title').textContent=titles[id]; window.scrollTo(0,0)}
$$('.tab').forEach(t=>t.onclick=()=>showView(t.dataset.view));
render(); showView('homeView'); if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
</script>
</body></html>
