function daysTo(d){return Math.ceil((new Date(d+'T12:00:00')-new Date())/86400000)}
function five24Cutoff(){const d=new Date(); d.setHours(0,0,0,0); d.setMonth(d.getMonth()-24); return d}
function validOpenDate(c){if(!c||!c.opened)return null;const d=new Date(c.opened+'T12:00:00');return Number.isNaN(d.getTime())?null:d}

  const opened=validOpenDate(c);
  return !!opened&&opened>=five24Cutoff();
}

function five24Status(c){
  if(c.five24Override==='count')return {label:'Counts toward 5/24',reason:'Manual override',tone:'amber'};
  if(c.five24Override==='nocount')return {label:'Does not count',reason:'Manual override',tone:'green'};

  return {label:'Counts toward 5/24',reason:'Opened within 24 months',tone:'amber'};
}

function relationshipSummary(){const r=data.profile.relationships||{};const a=[];const pm={member:'BofA Member','preferred-plus':'BofA Preferred Plus','preferred-honors':'BofA Preferred Honors',premier:'BofA Premier'};const bm={gold:'BofA Business Gold',platinum:'BofA Business Platinum','platinum-honors':'BofA Business Platinum Honors'};if(pm[r.bofaPersonal])a.push(pm[r.bofaPersonal]);if(bm[r.bofaBusiness])a.push(bm[r.bofaBusiness]);if(r.citi==='citigold')a.push('Citigold');if(r.citi==='private')a.push('Citigold Private Client');if(r.schwab&&r.schwab!=='none')a.push('Schwab');if(r.morganStanley&&r.morganStanley!=='none')a.push('Morgan Stanley');if(r.robinhood==='investor')a.push('Robinhood');if(r.robinhood==='gold')a.push('Robinhood Gold');if(r.robinhood==='gold-card')a.push('Robinhood Gold Card');if(r.fidelity&&r.fidelity!=='none')a.push('Fidelity');if(r.bilt==='member')a.push('Bilt member');if(r.bilt==='card')a.push('Bilt cardholder');if(r.chase&&r.chase!=='none')a.push(r.chase==='private'?'Chase Private Client / J.P. Morgan':'Chase banking');if(r.wells==='banking')a.push('Wells Fargo');if(r.usbank==='banking')a.push('U.S. Bank');if(r.sofi==='member')a.push('SoFi');if(r.navy==='member')a.push('Navy Federal');if(r.penfed==='member')a.push('PenFed');if(r.capitalone==='banking')a.push('Capital One');if(r.pnc==='banking')a.push('PNC');if(r.ally==='banking')a.push('Ally');if(r.usaa==='member')a.push('USAA');if(r.vanguard==='investor')a.push('Vanguard');if(r.etrade==='investor')a.push('E*TRADE');return a.length?a.join(', '):'None saved'}
function bofaTierBonus(type){const r=data.profile.relationships||{};if(type==='Business')return ({gold:0.25,platinum:0.50,'platinum-honors':0.75})[r.bofaBusiness]||0;return ({member:0.10,'preferred-plus':0.25,'preferred-honors':0.50,premier:0.75})[r.bofaPersonal]||0}
function bofaOngoingInfo(o){if(data.profile.applyRelationships===false||o.issuer!=='Bank of America')return null;const name=String(o.name||'').toLowerCase(),bonus=bofaTierBonus(o.type);if(!bonus)return null;let baseGeneral=null,travelDining=null,label='';if(name.includes('unlimited cash rewards')){baseGeneral=1.5;label='unlimited cash back'}else if(name.includes('premium rewards elite')||name==='premium rewards'){baseGeneral=1.5;travelDining=2.0;label='points redeemable for cash'}else if(name.includes('customized cash rewards')){const choice=3*(1+bonus);return {choiceRate:choice,bonus,label:'choice-category cash back'}}else{return null}const general=baseGeneral*(1+bonus);const td=travelDining?travelDining*(1+bonus):null;const spend=annualSpendAmount();const annual=spend?spend*general/100:null;const benchmark=spend?spend*0.02:null;return {generalRate:general,travelDiningRate:td,bonus,label,spend,annual,incrementalVs2:annual&&benchmark?annual-benchmark:null}}
function bofaOngoingText(o){const x=bofaOngoingInfo(o);if(!x)return '';if(x.choiceRate)return `<div class="small" style="margin-top:6px;color:#365d96"><b>Relationship earning potential:</b> up to ${x.choiceRate.toFixed(3).replace(/0+$/,'').replace(/\.$/,'')}% in the eligible choice category under current terms and category caps.</div>`;let t=`<div class="small" style="margin-top:6px;color:#365d96"><b>Relationship earning potential:</b> ${x.generalRate.toFixed(3).replace(/0+$/,'').replace(/\.$/,'')}% equivalent on general purchases`;if(x.travelDiningRate)t+=` and ${x.travelDiningRate.toFixed(2)} points/$ on travel & dining`;t+='.';if(x.annual)t+=` At ${annualSpendLabel()}, that is about <b>${fmt(Math.round(x.annual))}/year</b> on general spend before annual fees, credits, or redemption differences.`;t+='</div>';return t}
function relationshipEffect(o){const r=data.profile.relationships||{},tags=offerTags(o),reasons=[],cautions=[];let score=0;const name=String(o.name||'').toLowerCase(),issuer=String(o.issuer||'').toLowerCase();const useRel=data.profile.applyRelationships!==false;
  // Even when relationship economics are saved-only, keep true access/membership requirements visible.
  if(!useRel){
    if(name.includes('charles schwab')&&(!r.schwab||r.schwab==='none')){score-=18;cautions.push('This card requires an eligible Schwab relationship.');}
    if(name.includes('morgan stanley')&&(!r.morganStanley||r.morganStanley==='none')){score-=18;cautions.push('This card requires an eligible Morgan Stanley relationship.');}
    if(issuer==='robinhood'||name.includes('robinhood')){if(r.robinhood==='gold-card'){score-=25;cautions.push('You already have the Robinhood Gold Card.')}else if(r.robinhood!=='gold'){score-=8;cautions.push('The Robinhood Gold Card currently requires an annual Robinhood Gold subscription and may require waitlist/invitation access.')}}
    if((issuer.includes('navy federal')||tags['navy federal'])&&r.navy!=='member'){score-=12;cautions.push('Navy Federal membership eligibility is required.');}
    if((issuer.includes('penfed')||tags.penfed)&&r.penfed!=='member'){score-=6;cautions.push('PenFed membership is required before opening this card.');}
    return {score,reasons,cautions};
  }
  if(o.issuer==='Bank of America'||tags.bofa){if(o.type==='Personal'&&r.bofaPersonal&&r.bofaPersonal!=='none'){const m={member:[2,'10%'],'preferred-plus':[4,'25%'],'preferred-honors':[7,'50%'],premier:[10,'75%']}[r.bofaPersonal];if(m){score+=m[0];reasons.push(`Your BofA/Merrill relationship can add a ${m[1]} rewards bonus on eligible personal BofA cards.`)}}if(o.type==='Business'&&r.bofaBusiness&&r.bofaBusiness!=='none'){const m={gold:[4,'25%'],platinum:[7,'50%'],'platinum-honors':[10,'75%']}[r.bofaBusiness];if(m){score+=m[0];reasons.push(`Your Preferred Rewards for Business tier can add a ${m[1]} rewards bonus on eligible BofA business cards.`)}}const bi=bofaOngoingInfo(o);if(bi){if(bi.choiceRate){reasons.push(`Your relationship can raise the eligible choice-category rate to as much as ${bi.choiceRate.toFixed(2)}% under current caps and terms.`)}else{reasons.push(`Your relationship raises general earning on this card to about ${bi.generalRate.toFixed(3)}% equivalent${bi.travelDiningRate?` and travel/dining earning to ${bi.travelDiningRate.toFixed(2)} points/$`:''}.`);if(bi.spend&&bi.annual){reasons.push(`At ${annualSpendLabel()}, estimated ongoing general-spend rewards are about ${fmt(Math.round(bi.annual))} per year before fees and credits.`);const d=bi.incrementalVs2||0;if(d>=1000)score+=10;else if(d>=500)score+=7;else if(d>=250)score+=4;else if(d>=100)score+=2;}}}}
  if(o.issuer==='Citi'&&name.includes('strata elite')){if(r.citi==='citigold'){score+=10;reasons.push('Your Citigold relationship can improve Strata Elite economics through relationship credits under current terms.')}if(r.citi==='private'){score+=15;reasons.push('Your Citigold Private Client relationship can materially improve Strata Elite economics through relationship credits under current terms.')}}
  if(name.includes('charles schwab')){if(!r.schwab||r.schwab==='none'){score-=18;cautions.push('This card requires an eligible Schwab relationship.')}else{score+=r.schwab==='eligible'?4:r.schwab==='250k'?8:r.schwab==='1m'?12:18;reasons.push('Your Schwab relationship can improve access and relationship benefits for this card under current terms.')}}
  if(name.includes('morgan stanley')){if(!r.morganStanley||r.morganStanley==='none'){score-=18;cautions.push('This card requires an eligible Morgan Stanley relationship.')}else if(r.morganStanley==='cashplus'){score+=20;reasons.push('Your eligible Morgan Stanley Platinum CashPlus relationship may provide an annual engagement bonus that can offset the Platinum annual fee.')}else{score+=5;reasons.push('You have the eligible Morgan Stanley relationship required for this card.')}}
  if(issuer==='robinhood'||name.includes('robinhood')){if(r.robinhood==='gold-card'){score-=25;cautions.push('You already have the Robinhood Gold Card.')}else if(r.robinhood==='gold'){score+=10;reasons.push('Your Robinhood Gold membership satisfies the current membership requirement for the Gold Card.')}else{score-=8;cautions.push('The Robinhood Gold Card currently requires an annual Robinhood Gold subscription and may require waitlist/invitation access.')}}
  if(issuer==='fidelity'||name.includes('fidelity rewards')){if(r.fidelity&&r.fidelity!=='none'){score+=7;reasons.push('Your Fidelity relationship supports the card’s full 2% cash-back value when rewards are deposited to an eligible Fidelity account.')}else{score-=3;cautions.push('The Fidelity card’s 2% cash-back value applies when rewards are deposited into an eligible Fidelity account.')}}
  if(o.issuer==='Bilt'||name.includes('bilt')){if(r.bilt==='card'){score-=25;cautions.push('You already have a Bilt card, so CardPilot avoids treating another Bilt card as a new portfolio opportunity.')}else if(r.bilt==='member'){score+=3;reasons.push('Your existing Bilt membership makes the Bilt ecosystem somewhat more relevant.')}}
  if((issuer.includes('navy federal')||tags['navy federal'])&&r.navy!=='member'){score-=12;cautions.push('Navy Federal membership eligibility is required.')}if((issuer.includes('penfed')||tags.penfed)&&r.penfed!=='member'){score-=6;cautions.push('PenFed membership is required before opening this card.')}

  return true;
}
function refinementCandidates(){
  const type=data.profile.refineType||'all';
  const rank=data.profile.refineRank||'overall';
  let arr=rankedOffers().filter(x=>!x.fit.disabled&&x.fit.status!=='save'&&refineTypeMatches(x.offer,type));
  if(rank==='value')arr.sort((a,b)=>offerEstimatedSubValue(b.offer)-offerEstimatedSubValue(a.offer)||b.fit.score-a.fit.score);
  else if(rank==='roi')arr=arr.filter(x=>subReturnRange(x.offer)).sort((a,b)=>subReturnRange(b.offer).mid-subReturnRange(a.offer).mid||offerEstimatedSubValue(b.offer)-offerEstimatedSubValue(a.offer)||b.fit.score-a.fit.score);
  else if(rank==='cash')arr=arr.filter(x=>offerCashValue(x.offer)>0).sort((a,b)=>offerCashValue(b.offer)-offerCashValue(a.offer)||b.fit.score-a.fit.score);
  else if(rank==='points')arr=arr.filter(x=>pointCurrency(x.offer)).sort((a,b)=>offerEstimatedSubValue(b.offer)-offerEstimatedSubValue(a.offer)||b.fit.score-a.fit.score);
  else if(rank==='fee')arr.sort((a,b)=>Number(a.offer.af||0)-Number(b.offer.af||0)||b.fit.score-a.fit.score);
  else arr.sort((a,b)=>b.fit.score-a.fit.score);
  return arr;
}
function refinementSummary(){
  const rank=data.profile.refineRank||'overall',type=data.profile.refineType||'all';
  const rankMap={overall:'Best overall fit',value:'Highest estimated SUB value',roi:'Best SUB return on spend',cash:'Highest cash SUB',points:'Highest estimated points/miles value',fee:'Lowest annual fee'};
  const typeMap={all:'All reward types',cash:'Cash / cash back',points:'Points & miles',hotel:'Hotel',airline:'Airline',travel:'Travel',business:'Business cards',personal:'Personal cards'};
  return `${rankMap[rank]||rankMap.overall} • ${typeMap[type]||typeMap.all}`;
}
function setRefineRank(v){data.profile.refineRank=v;save();render();showView('applyView')}
function setRefineType(v){data.profile.refineType=v;save();render();showView('applyView')}
function clearRefinement(){data.profile.refineRank='overall';data.profile.refineType='all';save();render();showView('applyView')}
function refinementPanelHTML(){
  const rank=data.profile.refineRank||'overall',type=data.profile.refineType||'all';
  const rankChoices=[['overall','Best overall fit'],['value','Highest estimated SUB value'],['roi','Best SUB return on spend'],['cash','Highest cash SUB'],['points','Highest points/miles value'],['fee','Lowest annual fee']];
  const typeChoices=[['all','All'],['cash','Cash'],['points','Points & miles'],['hotel','Hotel'],['airline','Airline'],['travel','Travel'],['business','Business'],['personal','Personal']];
  return `<details class="card" style="margin:12px 0" ${rank!=='overall'||type!=='all'?'open':''}><summary><b>Fine-tune these recommendations</b></summary><div class="small" style="margin:8px 0 12px">Start broad, then narrow the cards without redoing setup. For example, rank by highest estimated SUB value or best SUB return on spend first, then show only cash, points, hotel, or airline cards.</div><div class="subchoices"><h4>Rank by</h4><div class="interestgrid">${rankChoices.map(x=>`<button class="interest ${rank===x[0]?'selected':''}" onclick="setRefineRank('${x[0]}')">${x[1]}</button>`).join('')}</div></div><div class="subchoices" style="margin-top:14px"><h4>Narrow to</h4><div class="interestgrid">${typeChoices.map(x=>`<button class="interest ${type===x[0]?'selected':''}" onclick="setRefineType('${x[0]}')">${x[1]}</button>`).join('')}</div></div><div class="between" style="margin-top:12px"><div class="small"><b>Current refinement:</b> ${refinementSummary()}</div><button class="btn ghost" onclick="clearRefinement()">Reset refinement</button></div></details>`;
}
function refinedRecommendationCard(x,rank){
  const o=x.offer,fit=x.fit,est=offerEstimatedSubValue(o),cash=offerCashValue(o);
  const rankMode=data.profile.refineRank||'overall';
  const badge=rank===1?'Top refined match':rank===2?'Next':'Also consider';
  let metric='';
  if(rankMode==='roi'){const r=subReturnRange(o);metric=r?`<div class="small" style="margin-top:5px;color:#365d96"><b>Spend-efficiency ranking:</b> ${Math.abs(r.low-r.high)<0.05?r.low.toFixed(1)+'%':r.low.toFixed(1)+'%–'+r.high.toFixed(1)+'%'}</div>`:'';}
  if(rankMode==='value')metric=est?`<div class="small" style="margin-top:5px;color:#365d96"><b>Estimated SUB value used for this ranking:</b> about ${fmt(Math.round(est))}</div>`:'';
  if(rankMode==='cash')metric=cash?`<div class="small" style="margin-top:5px;color:#365d96"><b>Cash SUB used for this ranking:</b> ${fmt(cash)}</div>`:'';
  if(rankMode==='points')metric=est?`<div class="small" style="margin-top:5px;color:#365d96"><b>Estimated points/miles SUB value used for this ranking:</b> about ${fmt(Math.round(est))}</div>`:'';
  if(rankMode==='fee')metric=`<div class="small" style="margin-top:5px;color:#365d96"><b>Annual fee used for this ranking:</b> ${fmt(Number(o.af||0))}</div>`;
  return `<div class="item" style="${rank===1?'border:2px solid #1f6fff;':''}"><div class="between"><div style="display:flex;gap:10px;align-items:flex-start"><span class="stepdot" style="flex:0 0 auto">${rank}</span><div><div class="item-title">${o.name}</div><div class="meta">${o.issuer||''}${o.issuer?' • ':''}${o.type} • AF ${fmt(o.af)} • ${o.spend!==null&&o.spend!==undefined?'Spend '+fmt(o.spend):'Spend: verify'}</div></div></div><span class="pill green">${badge}</span></div><div class="between" style="margin-top:9px"><b>${Number(o.bonus||0)?Number(o.bonus).toLocaleString()+' '+o.unit:'Offer varies / verify'}</b><div class="small">${historicalOfferText(o)}</div></div>${bonusValueText(o)}${subReturnText(o)}${metric}<div class="small" style="margin-top:8px"><b>Base fit score ${fit.score}/100</b></div><button class="btn ghost" style="margin-top:9px" onclick="whyOffer(${o.id})">Why this card?</button><div class="small" style="margin-top:7px">${o.verified?'Verified '+o.verifiedDate:'Needs verification'}</div></div>`;
}
function apply(){
  const ranked=rankedOffers(), f=five24();
  const considers=ranked.filter(x=>x.fit.status==='consider').sort((a,b)=>b.fit.score-a.fit.score);
  const waits=ranked.filter(x=>x.fit.status==='wait').sort((a,b)=>b.fit.score-a.fit.score);
  const nonmatches=ranked.filter(x=>x.fit.status==='avoid').sort((a,b)=>b.fit.score-a.fit.score);
  const overlap=companionSelected()?companionOverlapAdvice():null, sw=southwestTimingAdvice();
  const refineActive=(data.profile.refineRank||'overall')!=='overall'||(data.profile.refineType||'all')!=='all';
  const refined=refineActive?refinementCandidates().slice(0,5):[];
  const rankedCards=considers.slice(0,3).map((x,i)=>rankedOfferCard(x,i+1)).join('');
  const refinedCards=refineActive?refined.map((x,i)=>refinedRecommendationCard(x,i+1)).join(''):'';
  const noStrong=considers.length?'' : `<div class="note" style="margin-bottom:12px"><b>No strong apply-now match.</b><div class="small" style="margin-top:5px">CardPilot will not promote a card that fails your current preferences. You can still use Fine-tune recommendations to rank the eligible pool by SUB value or reward type.</div></div>`;
  const waitHtml=waits.length?`<details class="card" style="margin-top:14px"><summary><b>Worth waiting for (${waits.length})</b></summary><div class="small" style="margin:8px 0 10px">Good fits where timing or the current offer gives CardPilot a reason to wait.</div><div class="list">${waits.map(x=>offerCard(x.offer,true,x.fit)).join('')}</div></details>`:'';
  const noMatchHtml=nonmatches.length?`<details class="card" style="margin-top:12px"><summary><b>See cards that didn't match (${nonmatches.length})</b></summary><div class="small" style="margin:8px 0 10px">These are intentionally kept out of your main recommendations. Hard eligibility and setup constraints remain in force even when you fine-tune results.</div><div class="list">${nonmatches.map(x=>offerCard(x.offer,true,x.fit)).join('')}</div></details>`:'';
  return `<div class="between" style="margin-bottom:12px"><button class="btn ghost" onclick="showView('homeView')">← Home</button><button class="btn ghost" onclick="restartSetup()">Change preferences</button></div>${f>=5?`<div class="warningbox"><b>${f}/24: Chase cards are ${data.profile.includeChaseOver524?'included by your override':'grayed out by default'}.</b></div>`:''}${overlap?`<div class="note" style="margin-bottom:12px"><b>Companion benefit strategy:</b> ${overlap.message}</div>`:''}<div class="section" style="margin-top:0">Top recommendations for you</div><div class="small" style="margin-bottom:12px">Start with CardPilot's overall ranking, then fine-tune the result set without answering the setup questions again.</div>${noStrong}<div class="list">${rankedCards}</div>${refinementPanelHTML()}${refineActive?`<div class="section">Refined results</div><div class="small" style="margin-bottom:10px"><b>${refinementSummary()}</b>. These are ranked from the eligible pool after your original pathway, 5/24, fee, and SUB-spend constraints are applied.</div>${refined.length?`<div class="list">${refinedCards}</div>`:`<div class="note"><b>No cards match this refinement.</b><div class="small" style="margin-top:5px">Try a broader reward type or reset the refinement.</div></div>`}`:''}${waitHtml}${noMatchHtml}${valuationInfoHTML()}${sw?`<div class="card strategy-card" style="margin-top:12px"><div class="small">SAVED STRATEGY</div><h3>Southwest Companion Pass — target ${sw.target}</h3><div class="small">Suggested application window: <b>${sw.applyWindow}</b></div><div class="small" style="margin-top:6px">${sw.note}</div></div>`:''}`;
}
function rankedOfferCard(x,rank){
  const o=x.offer, fit=x.fit;
  const badge=rank===1?'Best match':rank===2?'Next best':'Strong alternative';
  const why=[...fit.reasons].slice(0,4).map(r=>`<div style="margin-top:4px;color:#157347">✓ ${r}</div>`).join('');
  return `<div class="item" style="${rank===1?'border:2px solid #1f6fff;':''}"><div class="between"><div style="display:flex;gap:10px;align-items:flex-start"><span class="stepdot" style="flex:0 0 auto">${rank}</span><div><div class="item-title">${o.name}</div><div class="meta">${o.issuer||''}${o.issuer?' • ':''}${o.type} • AF ${fmt(o.af)} • ${o.spend!==null&&o.spend!==undefined?'Spend '+fmt(o.spend):'Spend: verify'}</div></div></div><span class="pill green">${badge}</span></div><div class="between" style="margin-top:9px"><b>${Number(o.bonus||0)?Number(o.bonus).toLocaleString()+' '+o.unit:'Offer varies / verify'}</b><div class="small">${historicalOfferText(o)}</div></div>${bonusValueText(o)}${subReturnText(o)}${bofaOngoingText(o)}<div class="small" style="margin-top:8px"><b>Fit score ${fit.score}/100</b>${why}</div><button class="btn ghost" style="margin-top:9px" onclick="whyOffer(${o.id})">Why this is #${rank}</button><div class="small" style="margin-top:7px">${o.verified?'Verified '+o.verifiedDate:'Needs verification'}</div></div>`;
}
function offerCard(o,reason=false,fit=null){
  fit=fit||offerFit(o);
  const cls=fit.status==='consider'?'green':fit.status==='wait'?'amber':fit.status==='save'?'blue':'red';
  return `<div class="item ${fit.disabled?'disabled-card':''}"><div class="between"><div><div class="item-title">${o.name}</div><div class="meta">${o.issuer||''}${o.issuer?' • ':''}${o.type} • AF ${fmt(o.af)} • ${o.spend!==null&&o.spend!==undefined?'Spend '+fmt(o.spend):'Spend: verify'}</div></div><span class="pill ${cls}">${fit.label}</span></div><div class="between" style="margin-top:9px"><div><b>${Number(o.bonus||0)?Number(o.bonus).toLocaleString()+' '+o.unit:'Offer varies / verify'}</b></div><div class="small">${historicalOfferText(o)}</div></div>${bonusValueText(o)}${subReturnText(o)}${bofaOngoingText(o)}${o.offerNote?`<div class="small" style="margin-top:6px">${o.offerNote}</div>`:''}${reason?`<div class="small" style="margin-top:7px"><b>Fit score ${fit.score}/100.</b>${fit.reasons[0]?` <span style="color:#157347">✓ ${fit.reasons[0]}</span>`:''}${fit.cautions[0]?`<div style="margin-top:4px;color:#9b2c2c">✕ ${fit.cautions[0]}</div>`:''}</div><button class="btn ghost" style="margin-top:8px;padding:7px 10px" onclick="whyOffer(${o.id})">Why?</button>`:''}<div class="small" style="margin-top:7px">${o.verified?'Verified '+o.verifiedDate:'Needs verification'}</div></div>`
}
function whyOffer(id){
  const o=data.offers.find(x=>x.id===id);if(!o)return;
  const fit=offerFit(o);
  const parts=[`${o.name}: ${fit.label} (${fit.score}/100)`];
  if(fit.reasons.length)parts.push('Why it fits:\n• '+fit.reasons.join('\n• '));
  if(fit.cautions.length)parts.push('What holds it back:\n• '+fit.cautions.join('\n• '));
  parts.push(`Pathway: ${pathLabel()}. CardPilot evaluates 5/24 constraints and your preservation preference, annual-fee preference, offer strength versus historical highs, your selected interests, banking/investment relationship benefits, and any strategy you are intentionally preserving.`);
  alert(parts.join('\n\n'));
}

function offers(){
  const list=pathwayOffers();
  const issuers=[...new Set(list.map(o=>o.issuer||'Other'))].sort();
  return `<div class="between"><div><div class="section" style="margin-top:0">${data.profile.cardPath==='business'?'Business card market':data.profile.cardPath==='personal'?'Personal card market':'Card market'}</div><div class="small">${list.length} cards in this pathway • catalog snapshot ${data.catalogVersion||''}</div></div></div>
  <div class="card" style="margin:12px 0"><div class="small">PATHWAY</div><div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn ${data.profile.cardPath==='business'?'':'ghost'}" onclick="setCardPath('business')">Business</button><button class="btn ${data.profile.cardPath==='personal'?'':'ghost'}" onclick="setCardPath('personal')">Personal</button><button class="btn ${data.profile.cardPath==='either'?'':'ghost'}" onclick="setCardPath('either')">Both</button></div><div class="help">The selected pathway controls both the market view and Apply Next algorithm.</div><div class="field" style="margin-top:12px"><label class="field-label">Search this market</label><input id="marketSearch" placeholder="Search issuer, card, airline, hotel, cash back…" oninput="filterMarket()"></div></div>
  <div id="marketGroups">${issuers.map(issuer=>`<div class="market-group" data-issuer="${issuer.toLowerCase()}"><div class="section">${issuer}</div><div class="list">${list.filter(o=>(o.issuer||'Other')===issuer).map(o=>`<div class="market-card" data-search="${`${o.name} ${o.issuer} ${(o.tags||[]).join(' ')} ${o.status||''}`.toLowerCase()}">${offerCard(o,false,offerFit(o))}</div>`).join('')}</div></div>`).join('')}</div>
  <div class="note" style="margin-top:16px"><b>Database structure:</b> Card identity is kept separate from changing offer information in the recommendation logic. Statuses such as closed-new, membership, regional, or availability-varies are retained so existing users can track cards without CardPilot pretending they are universally open to new applicants. Offers change frequently and should be verified before application.</div>`;
}
function filterMarket(){const q=($('#marketSearch')?.value||'').trim().toLowerCase();$$('.market-card').forEach(el=>el.style.display=!q||el.dataset.search.includes(q)?'':'none');$$('.market-group').forEach(g=>{const any=[...g.querySelectorAll('.market-card')].some(x=>x.style.display!=='none');g.style.display=any?'':'none'})}

function benefits(){const sorted=[...data.benefits].sort((a,b)=>new Date(a.expires||'2999-12-31')-new Date(b.expires||'2999-12-31'));const sw=savedStrategy('southwest_cp');return `<div class="between"><div class="section" style="margin-top:0">Benefits & Strategies</div><button onclick="showAddBenefit()">+ Add</button></div><div class="card strategy-card" style="margin-bottom:12px"><div class="small">COMPANION BENEFITS</div><h3>Track passes, fares, and certificates</h3><div class="small">CardPilot uses expiration dates to avoid recommending unnecessary overlap and to suggest when to plan the next companion benefit.</div></div><div id="addBenefitBox"></div><div class="list">${sorted.map(b=>`<div class="item between"><div><div class="item-title">${b.name}</div><div class="meta">${b.kind==='companion'?'Companion benefit • ':''}${b.program?b.program+' • ':''}${b.value||''}${b.expires?' • Expires '+b.expires:''}</div></div>${b.expires?`<span class="pill ${daysTo(b.expires)<60?'red':daysTo(b.expires)<120?'amber':'green'}">${daysTo(b.expires)} days</span>`:''}</div>`).join('')||'<div class="empty">No benefits tracked yet.</div>'}</div><div class="section">Saved Strategies</div><div class="card"><h3>Southwest Companion Pass timing</h3><div class="small">Save a target qualification year only if you want CardPilot to preserve Southwest opportunities for that plan.</div><div class="formgrid" style="margin-top:10px"><div class="field"><label class="field-label">Target qualification year</label><input id="swTarget" type="number" min="2026" max="2035" value="${sw?.targetYear||''}" placeholder="e.g. 2028"></div><div class="field"><label class="field-label">Optional note</label><input id="swNote" value="${sw?.note||''}" placeholder="e.g. wait until current pass ends"></div></div><div class="row" style="margin-top:10px"><button onclick="saveSouthwestStrategy()">Save strategy</button>${sw?`<button class="btn ghost" onclick="removeSouthwestStrategy()">Remove</button>`:''}</div></div>`}
function showAddBenefit(){const box=$('#addBenefitBox');if(!box)return;box.innerHTML=`<div class="card" style="margin-bottom:12px"><h3>Add benefit</h3><div class="formgrid"><div class="field"><label class="field-label">Benefit name</label><input id="bn" placeholder="e.g. Atmos companion fare"></div><div class="field"><label class="field-label">Type</label><select id="bk"><option value="general">General benefit</option><option value="companion">Companion pass / fare / certificate</option></select></div><div class="field"><label class="field-label">Airline / program</label><input id="bp" placeholder="e.g. Southwest, Atmos"></div><div class="field"><label class="field-label">Expiration date</label><input id="be" type="date"></div></div><div class="field" style="margin-top:10px"><label class="field-label">Value / note</label><input id="bv" placeholder="Optional note"></div><button style="margin-top:10px" onclick="addBenefit()">Save benefit</button></div>`}
function addBenefit(){if(!$('#bn').value)return;data.benefits.push({id:Date.now(),name:$('#bn').value,kind:$('#bk').value,program:$('#bp').value,value:$('#bv').value,expires:$('#be').value});save();showView('benefitsView')}
function saveSouthwestStrategy(){const y=+($('#swTarget')?.value||0);if(!y){alert('Enter a target year.');return}data.profile.savedStrategies=(data.profile.savedStrategies||[]).filter(s=>s.type!=='southwest_cp');data.profile.savedStrategies.push({type:'southwest_cp',targetYear:y,note:$('#swNote')?.value||''});save();showView('benefitsView')}
function removeSouthwestStrategy(){data.profile.savedStrategies=(data.profile.savedStrategies||[]).filter(s=>s.type!=='southwest_cp');save();showView('benefitsView')}
function render(){
  $('#homeView').innerHTML=home();
  $('#cardsView').innerHTML=cards();
  try{$('#applyView').innerHTML=apply();}catch(e){console.error('Apply Next render error',e);$('#applyView').innerHTML=`<div class=\"card\"><h3>We hit a recommendation error</h3><div class=\"small\">${String(e&&e.message||e)}</div><button class=\"btn ghost\" style=\"margin-top:10px\" onclick=\"restartSetup()\">Review preferences</button></div>`;}
  $('#offersView').innerHTML=offers();
  $('#benefitsView').innerHTML=benefits();
  $('#relationshipsView').innerHTML=relationshipsPage();
}
function showView(id){$$('main section').forEach(s=>s.classList.add('hidden')); $('#'+id).classList.remove('hidden'); $$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===id)); const titles={homeView:'CardPilot',cardsView:'My Cards',applyView:'Apply Next',offersView:'Offers',benefitsView:'Benefits',relationshipsView:'Relationships & Ecosystems'}; $('#title').textContent=titles[id]||'CardPilot'; window.scrollTo(0,0)}
$$('.tab').forEach(t=>t.onclick=()=>showView(t.dataset.view));
render(); const postTarget=data.profile.postSetupTarget; if(postTarget){delete data.profile.postSetupTarget; localStorage.setItem('cardpilotData',JSON.stringify(data)); showView(postTarget)}else{showView('homeView')} if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{}); if(window.caches){caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))).catch(()=>{});}}
</script>
