function offerFit(o){
  if(o.status==='closed-new') return {status:'avoid',label:'Closed to new applicants',score:0,strength:null,reasons:[],cautions:['This product is retained for tracking but is not currently open to new applicants.']};
  const f=five24();

  const max=Number(data.profile.maxSpend||8000);
  const sub=activeSub();
  const rem=sub?Math.max(0,Number(sub.sub.need||0)-Number(sub.sub.done||0)):0;
  const openBiz=(data.profile.cardPath||'either')!=='personal';
  const tags=offerTags(o);
  const reasons=[];
  const cautions=[];
  let score=50;
  let forced=null;

  // 0) Hard pathway selection.
  const path=data.profile.cardPath||'either';
  if(path==='business' && o.type!=='Business'){forced='avoid';score=0;cautions.push('You selected the business-card pathway.');}
  if(path==='personal' && o.type!=='Personal'){forced='avoid';score=0;cautions.push('You selected the personal-card pathway.');}

  // 1) Protect a strategy that is intentionally being saved for a future calendar year.
  if(tags.southwest && o.type==='Business' && data.profile.cpTargetYear){
    const y=Number(data.profile.cpTargetYear);
    if(y>=new Date().getFullYear()+1){
      forced='save';
      reasons.push(`Preserve this card for the ${y} Companion Pass strategy.`);
      score=5;
    }
  }

  // 2) Finish active SUBs before taking on a competing minimum-spend target.
  if(sub && rem>0){
    const covering=data.expenses.some(e=>e.assigned===sub.name && Number(e.amount||0)>=rem);
    if(covering){
      reasons.push(`Your existing ${sub.name} SUB appears covered by an assigned expense.`);
      score+=4;
    } else {
      cautions.push(`${fmt(rem)} still remains on ${sub.name}.`);
      score-=22;
      if(!forced) forced='wait';
    }
  }

  // 3) Spend fit. maxSpend is the user's comfortable 3-month organic spend ceiling.
  const spendHeadroom=Math.max(0,max-(sub?rem:0));
  if(o.spend===null||o.spend===undefined){cautions.push('Minimum-spend requirement needs verification before applying.');score-=5;}
  else if(o.spend<=max){score+=12;reasons.push(`${fmt(o.spend)} minimum spend fits your ${fmt(max)} 3-month spend setting.`)}
  else {score-=30;cautions.push(`${fmt(o.spend)} minimum spend exceeds your ${fmt(max)} spend setting.`);if(!forced)forced='wait'}
  if(sub && rem>0 && o.spend!==null && o.spend!==undefined && o.spend>spendHeadroom){
    cautions.push(`After reserving spend for the active SUB, there may not be enough room for this offer yet.`);
    score-=10;
  }

  // 4) 5/24 / business-card runway.
  if(o.type==='Business'){
    if(openBiz){score+=14;reasons.push('Business cards are enabled in your setup, which can preserve personal-card capacity when the account does not report personally.')}
    else {score-=18;cautions.push('You told CardPilot to use personal cards only.');if(!forced)forced='avoid'}
  } else if(o.reports){
    if(f>=4){score-=28;cautions.push(`At ${f}/24, a new personal account may consume a scarce Chase slot.`);if(!forced)forced='wait'}
    else if(f===3){score-=12;cautions.push('You are 3/24, so a personal application uses one of two remaining 5/24 slots.')}
    else {score-=3}
  }

  // 5) Offer strength vs historical high.
  const strength=o.hist?Math.round(Number(o.bonus)/Number(o.hist)*100):null;
  if(strength!==null){
    if(strength>=100){score+=18;reasons.push('The tracked offer is at its historical high.')}
    else if(strength>=90){score+=9;reasons.push(`The tracked offer is ${strength}% of the historical high.`)}
    else if(strength>=80){reasons.push(`The tracked offer is ${strength}% of the historical high.`)}
    else {score-=14;cautions.push(`The tracked offer is only ${strength}% of the historical high.`);if(!forced)forced='wait'}
  }

  // 6) Goal fit. This does not override hard constraints above.
  if(goal==='Cash back'){
    if(tags.cash){score+=15;reasons.push('This offer matches your cash-back goal.')} else score-=5;
  } else if(goal==='Hotel nights / status'){
    if(tags.hotel){score+=15;reasons.push('This offer matches your hotel goal.')} else score-=4;
  } else if(goal==='Southwest Companion Pass'){
    if(tags.southwest){score+=12;reasons.push('This card is relevant to your Companion Pass goal, subject to your saved timing strategy.')} else score-=5;
  } else if(goal==='Travel points'){
    if(tags.airline||tags.hotel){score+=10;reasons.push('This earns a travel-focused rewards currency.')}
  } else if(goal==='Maximum SUBs'){
    if(strength>=90){score+=7}
  }

  if(!Number(o.bonus||0)){score-=10;cautions.push(o.offerNote||'Current welcome offer needs verification before applying.');}

  if(Number(o.af||0)===0){score+=5;reasons.push('No annual fee lowers the cost of testing the card long term.')}

  if(!status){
    if(score>=75)status='consider';
    else if(score>=52)status='wait';

}

leAddSubFields()"> Track an active SUB</label><div id="addSubFields" class="hidden" style="margin-top:10px"><div class="formgrid"><div class="field"><label class="field-label" for="csbonus">SUB amount / description</label><input id="csbonus" placeholder="e.g. 100,000 points"></div><div class="field"><label class="field-label" for="csneed">Spend requirement</label><input id="csneed" type="number" placeholder="Minimum spend"></div><div class="field"><label class="field-label" for="csdone">Spend completed</label><input id="csdone" type="number" placeholder="Spent so far"></div><div class="field"><label class="field-label" for="csdue">SUB deadline</label><input id="csdue" type="date"></div></div></div></div><button style="margin-top:12px" onclick="addCard()">Save card</button></div>`}
function renderCardSearch(){const q=($('#cardSearch')?.value||'').trim().toLowerCase();const box=$('#cardSearchResults');if(!box)return;if(q.length<2){box.innerHTML='';return}const all=[...PERSONAL_CATALOG,...BUSINESS_CATALOG];const matches=all.filter(o=>`${o.name} ${o.issuer} ${(o.tags||[]).join(' ')}`.toLowerCase().includes(q)).slice(0,8);box.innerHTML=matches.map(o=>`<button class="choice" style="width:100%" onclick="selectCatalogCard(${o.id})"><b>${o.name}</b><br><span class="small">${o.issuer} • ${o.type} • AF ${fmt(o.af)}${o.status&&o.status!=='open'?` • ${o.status}`:''}</span></button>`).join('')||'<div class="small">No database match. You can enter it manually below.</div>'}
function selectCatalogCard(id){const o=[...PERSONAL_CATALOG,...BUSINESS_CATALOG].find(x=>x.id===id);if(!o)return;$('#cn').value=o.name;$('#ct').value=o.type;$('#caf').value=o.af||0;$('#cr').checked=!!o.reports;$('#c524').value='auto';const m=$('#selectedCardMeta');if(m)m.innerHTML=`Selected from database: <b>${o.issuer} • ${o.name}</b>${o.status&&o.status!=='open'?` • ${o.status}`:''}.`;const r=$('#cardSearchResults');if(r)r.innerHTML='';}

function toggleAddSubFields(){const el=$('#addSubFields');if(el)el.classList.toggle('hidden',!$('#csubactive').checked)}
function addCard(){const n=$('#cn').value.trim(); if(!n)return;const card={id:Date.now(),name:n,type:$('#ct').value,opened:$('#co').value||new Date().toISOString().slice(0,10),af:+$('#caf').value||0,reports:$('#cr').checked,five24Override:$('#c524').value};if($('#csubactive').checked){card.sub={bonus:$('#csbonus').value.trim()||'Welcome bonus',need:+$('#csneed').value||0,done:+$('#csdone').value||0,due:$('#csdue').value,active:true}}data.cards.push(card); save(); showView('cardsView')}
function showEditCard(id){const c=data.cards.find(x=>x.id===id);if(!c)return;const box=$('#addCardBox');if(!box)return;const sub=c.sub||{bonus:'',need:0,done:0,due:'',active:false};box.innerHTML=`<div class="card" style="margin-bottom:12px"><h3>Edit card</h3><div class="formgrid"><div class="field"><label class="field-label" for="ecn">Card name</label><textarea class="namebox" id="ecn">${c.name}</textarea></div><div class="field"><label class="field-label" for="ect">Card type</label><select id="ect"><option ${c.type==='Business'?'selected':''}>Business</option><option ${c.type==='Personal'?'selected':''}>Personal</option></select></div><div class="field"><label class="field-label" for="ecaf">Annual fee</label><input id="ecaf" type="number" value="${c.af||0}" placeholder="Annual fee"></div><div class="field"><label class="field-label" for="eco">Account open date</label><input id="eco" type="date" value="${c.opened||''}" aria-label="Account open date"></div></div><div class="subbox"><label class="field-label" for="ec524">5/24 treatment</label><select id="ec524"><option value="auto" ${(c.five24Override||'auto')==='auto'?'selected':''}>Auto / based on reporting</option><option value="count" ${c.five24Override==='count'?'selected':''}>Force: counts toward 5/24</option><option value="nocount" ${c.five24Override==='nocount'?'selected':''}>Force: does not count toward 5/24</option></select><label class="small" style="display:block;margin:10px 0"><input id="ecr" type="checkbox" style="width:auto" ${c.reports?'checked':''}> Reports as personal account</label><div class="help">Current CardPilot treatment: <b>${five24Label(c)}</b>. Use the override if you need to correct the automatic treatment.</div></div><div class="subbox"><label class="small"><input id="esactive" type="checkbox" style="width:auto" ${sub.active?'checked':''} onchange="toggleEditSubFields()"> Track an active SUB</label><div id="editSubFields" class="${sub.active?'':'hidden'}" style="margin-top:10px"><div class="formgrid"><div class="field"><label class="field-label" for="esbonus">SUB amount / description</label><input id="esbonus" value="${sub.bonus||''}" placeholder="e.g. 100,000 points"></div><div class="field"><label class="field-label" for="esneed">Spend requirement</label><input id="esneed" type="number" value="${sub.need||0}" placeholder="Minimum spend"></div><div class="field"><label class="field-label" for="esdone">Spend completed</label><input id="esdone" type="number" value="${sub.done||0}" placeholder="Spent so far"></div><div class="field"><label class="field-label" for="esdue">SUB deadline</label><input id="esdue" type="date" value="${sub.due||''}"></div></div></div></div><div class="row" style="margin-top:12px"><button onclick="saveCardEdit(${c.id})">Save changes</button><button class="btn ghost" onclick="clearCardEditor()">Cancel</button></div></div>`;box.scrollIntoView({behavior:'smooth',block:'start'})}
function toggleEditSubFields(){const el=$('#editSubFields');if(el)el.classList.toggle('hidden',!$('#esactive').checked)}
function clearCardEditor(){const box=$('#addCardBox');if(box)box.innerHTML=''}
function saveCardEdit(id){const c=data.cards.find(x=>x.id===id);if(!c)return;c.name=$('#ecn').value.trim()||c.name;c.type=$('#ect').value;c.af=+$('#ecaf').value||0;c.opened=$('#eco').value||c.opened;c.reports=$('#ecr').checked;c.five24Override=$('#ec524').value;if($('#esactive').checked){c.sub={bonus:$('#esbonus').value.trim()||'Welcome bonus',need:+$('#esneed').value||0,done:+$('#esdone').value||0,due:$('#esdue').value,active:true}}else if(c.sub){c.sub.active=false}save();showView('cardsView')}
function removeCard(id){const c=data.cards.find(x=>x.id===id);if(!c)return;if(!confirm(`Remove ${c.name}? This cannot be undone.`))return;data.cards=data.cards.filter(c=>c.id!==id); save(); showView('cardsView')}
function apply(){
  const s=activeSub();
  const goal=data.profile.goal||'Not set';
  const ranked=rankedOffers();
  const counts={consider:0,wait:0,save:0,avoid:0};ranked.forEach(x=>counts[x.fit.status]++);
  return `<div class="section" style="margin-top:0">Apply Next</div>
  ${s?`<div class="note"><b>Current priority: finish ${s.name}.</b><br>${fmt(Math.max(0,s.sub.need-s.sub.done))} remaining${s.sub.due?` before ${s.sub.due}`:''}. Recommendations below account for that commitment.</div>`:''}
  <div class="card" style="margin-bottom:12px"><div class="small">CARD PATHWAY</div><h3 style="margin-top:4px">${pathLabel()}</h3><div class="small">Goal: ${goal}. Spend ceiling: ${fmt(data.profile.maxSpend||8000)}. 5/24: ${five24()}/24.</div><div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn ${data.profile.cardPath==='business'?'':'ghost'}" onclick="setCardPath('business')">Business</button><button class="btn ${data.profile.cardPath==='personal'?'':'ghost'}" onclick="setCardPath('personal')">Personal</button><button class="btn ${data.profile.cardPath==='either'?'':'ghost'}" onclick="setCardPath('either')">Both</button></div></div><div class="card" style="margin-bottom:12px"><div class="small">HOW THE ALGORITHM IS THINKING</div><h3 style="margin-top:4px">${counts.consider} consider • ${counts.wait} wait • ${counts.save} preserve</h3><div class="small">Only cards in the selected pathway are ranked. Cards are then scored for active SUB load, spend fit, 5/24 impact, offer strength, goal fit, annual fee, and saved strategies.</div></div>
  <div class="section">For you</div><div class="list">${ranked.map(x=>offerCard(x.offer,true,x.fit)).join('')}</div>
  ${data.profile.cpTargetYear?`<div class="section">Saved strategy</div><div class="card"><h3>Southwest Companion Pass</h3><div class="small">CardPilot is preserving Southwest business-card opportunities for your ${data.profile.cpTargetYear} plan instead of ranking them as immediate applications.</div></div>`:''}`
}
function offerCard(o,reason=false,fit=null){
  fit=fit||offerFit(o);
  const cls=fit.status==='consider'?'green':fit.status==='wait'?'amber':fit.status==='save'?'blue':'red';
  return `<div class="item"><div class="between"><div><div class="item-title">${o.name}</div><div class="meta">${o.issuer||''}${o.issuer?' • ':''}${o.type} • AF ${fmt(o.af)} • ${o.spend!==null&&o.spend!==undefined?'Spend '+fmt(o.spend):'Spend: verify'}</div></div><span class="pill ${cls}">${fit.label}</span></div><div class="between" style="margin-top:9px"><div><b>${Number(o.bonus||0)?Number(o.bonus).toLocaleString()+' '+o.unit:'Offer varies / verify'}</b></div><div class="small">${fit.strength!==null?fit.strength+'% of historical high':'Historical high not set'}</div></div>${o.offerNote?`<div class="small" style="margin-top:6px">${o.offerNote}</div>`:''}${reason?`<div class="small" style="margin-top:7px"><b>Fit score ${fit.score}/100.</b> ${fit.reasons[0]||fit.cautions[0]||''}</div><button class="btn ghost" style="margin-top:8px;padding:7px 10px" onclick="whyOffer(${o.id})">Why?</button>`:''}<div class="small" style="margin-top:7px">${o.verified?'Verified '+o.verifiedDate:'Needs verification'}</div></div>`
}
function whyOffer(id){
  const o=data.offers.find(x=>x.id===id);if(!o)return;
  const fit=offerFit(o);
  const parts=[`${o.name}: ${fit.label} (${fit.score}/100)`];
  if(fit.reasons.length)parts.push('Why it fits:\n• '+fit.reasons.join('\n• '));
  if(fit.cautions.length)parts.push('What holds it back:\n• '+fit.cautions.join('\n• '));
  parts.push(`Pathway: ${pathLabel()}. CardPilot evaluates active SUB commitments, organic spend fit, 5/24 impact, offer strength versus historical highs, your stated goal, annual fee, and any strategy you are intentionally preserving.`);
  alert(parts.join('\n\n'));
}

function offers(){
  const list=pathwayOffers();
  const issuers=[...new Set(list.map(o=>o.issuer||'Other'))].sort();
  return `<div class="between"><div><div class="section" style="margin-top:0">${data.profile.cardPath==='business'?'Business card market':data.profile.cardPath==='personal'?'Personal card market':'Card market'}</div><div class="small">${list.length} cards in this pathway • catalog snapshot ${data.catalogVersion||''}</div></div></div>
  <div class="card" style="margin:12px 0"><div class="small">PATHWAY</div><div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn ${data.profile.cardPath==='business'?'':'ghost'}" onclick="setCardPath('business')">Business</button><button class="btn ${data.profile.cardPath==='personal'?'':'ghost'}" onclick="setCardPath('personal')">Personal</button><button class="btn ${data.profile.cardPath==='either'?'':'ghost'}" onclick="setCardPath('either')">Both</button></div><div class="help">The selected pathway controls both the market view and Apply Next algorithm.</div><div class="field" style="margin-top:12px"><label class="field-label">Search this market</label><input id="marketSearch" placeholder="Search issuer, card, airline, hotel, cash back…" oninput="filterMarket()"></div></div>
  <div id="marketGroups">${issuers.map(issuer=>`<div class="market-group" data-issuer="${issuer.toLowerCase()}"><div class="section">${issuer}</div><div class="list">${list.filter(o=>(o.issuer||'Other')===issuer).map(o=>`<div class="market-card" data-search="${`${o.name} ${o.issuer} ${(o.tags||[]).join(' ')} ${o.status||''}`.toLowerCase()}">${offerCard(o,false,offerFit(o))}</div>`).join('')}</div></div>`).join('')}</div>
  <div class="note" style="margin-top:16px"><b>Database structure:</b> Card identity is kept separate from changing offer information in the recommendation logic. Statuses such as closed-new, membership, regional, or availability-varies are retained so existing users can track cards without CardPilot pretending they are universally open to new applicants. Offers change frequently and should be verified before application.</div>`;
}
function filterMarket(){const q=($('#marketSearch')?.value||'').trim().toLowerCase();$$('.market-card').forEach(el=>el.style.display=!q||el.dataset.search.includes(q)?'':'none');$$('.market-group').forEach(g=>{const any=[...g.querySelectorAll('.market-card')].some(x=>x.style.display!=='none');g.style.display=any?'':'none'})}

function benefits(){const sorted=[...data.benefits].sort((a,b)=>new Date(a.expires)-new Date(b.expires));return `<div class="between"><div class="section" style="margin-top:0">Benefits</div><button onclick="showAddBenefit()">+ Add</button></div><div id="addBenefitBox"></div><div class="list">${sorted.map(b=>`<div class="item between"><div><div class="item-title">${b.name}</div><div class="meta">${b.value||''} • Expires ${b.expires}</div></div><span class="pill ${daysTo(b.expires)<60?'red':daysTo(b.expires)<120?'amber':'green'}">${daysTo(b.expires)} days</span></div>`).join('')||'<div class="empty">No benefits tracked yet.</div>'}</div><div class="section">Upcoming spend</div><div class="card"><h3>Add an expense</h3><div class="formgrid"><input id="en" placeholder="Expense name"><input id="ea" type="number" placeholder="Amount"><input id="ed" type="date"><input id="ef" type="number" step="0.1" placeholder="Card fee %"><select id="eas"><option value="">Unassigned</option>${data.cards.map(c=>`<option>${c.name}</option>`).join('')}</select></div><button style="margin-top:10px" onclick="addExpense()">Save expense</button></div>`}
function showAddBenefit(){const box=$('#addBenefitBox'); if(!box)return; box.innerHTML=`<div class="card" style="margin-bottom:12px"><h3>Add benefit</h3><div class="formgrid"><input id="bn" placeholder="Benefit name"><input id="bv" placeholder="Value / note"><input id="be" type="date"></div><button style="margin-top:10px" onclick="addBenefit()">Save benefit</button></div>`}
function addBenefit(){if(!$('#bn').value)return; data.benefits.push({id:Date.now(),name:$('#bn').value,value:$('#bv').value,expires:$('#be').value}); save(); showView('benefitsView')}
function addExpense(){if(!$('#en').value||!$('#ea').value)return; data.expenses.push({id:Date.now(),name:$('#en').value,amount:+$('#ea').value,date:$('#ed').value,fee:+$('#ef').value||0,assigned:$('#eas')?$('#eas').value:''}); save(); showView('benefitsView')}
function render(){ $('#homeView').innerHTML=home(); $('#cardsView').innerHTML=cards(); $('#applyView').innerHTML=apply(); $('#offersView').innerHTML=offers(); $('#benefitsView').innerHTML=benefits(); }
function showView(id){$$('main section').forEach(s=>s.classList.add('hidden')); $('#'+id).classList.remove('hidden'); $$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===id)); const titles={homeView:'CardPilot',cardsView:'My Cards',applyView:'Apply Next',offersView:'Offers',benefitsView:'Benefits'}; $('#title').textContent=titles[id]; window.scrollTo(0,0)}
$$('.tab').forEach(t=>t.onclick=()=>showView(t.dataset.view));
render(); showView('homeView'); if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
</script>
</body></html>
