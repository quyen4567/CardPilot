function migrateV8(){
  data.profile=data.profile||{};
  if(!data.profile.cardPath){
    data.profile.cardPath=data.profile.businessFirst===true?'business':data.profile.businessFirst===false?'personal':'either';
  }
  data.profile.businessFirst=data.profile.cardPath!=='personal';
  if(data.catalogVersion!=='8.0'){
    const oldPersonal=(data.offers||[]).filter(o=>o.type==='Personal');
    const overrides=new Map(oldPersonal.map(o=>[o.name,o]));
    const mergedPersonal=PERSONAL_CATALOG.map(o=>overrides.has(o.name)?{...o,...overrides.get(o.name),id:o.id}:o);
    data.offers=[...BUSINESS_CATALOG,...mergedPersonal];
    data.catalogVersion='8.0';
    localStorage.setItem('cardpilotData',JSON.stringify(data));
  }
}

function renderCardSearch(){const q=($('#cardSearch')?.value||'').trim().toLowerCase(),box=$('#cardSearchResults');if(!box)return;if(!q){box.innerHTML='';return}let rows=catalogCardsForAdd().filter(o=>(addCardFilter==='both'||o.type.toLowerCase()===addCardFilter)&&(`${o.name} ${o.issuer} ${(o.tags||[]).join(' ')}`).toLowerCase().includes(q)).slice(0,10);box.innerHTML=rows.map(o=>`<button class="choice" onclick="chooseCatalogCard(${o.id})"><b>${o.name}</b><br><span class="small">${o.issuer} • ${o.type} • AF ${fmt(o.af||0)}</span></button>`).join('')||'<div class="small">No matching card. Use manual entry below.</div>'}
function chooseCatalogCard(id){const o=data.offers.find(x=>x.id===id);if(!o)return;$('#cn').value=o.name;$('#ct').value=o.type;$('#caf').value=o.af||0;$('#cr').checked=!!o.reports;$('#c524').value='auto';const m=$('#selectedCardMeta');if(m)m.innerHTML=`Selected: <b>${o.issuer} ${o.name}</b> • ${o.type}. ${o.reports?'Normally treated as a personal-reporting account for this database.':'Normally treated as not reporting as a personal revolving account for this database.'}`}
function addCard(){if(!$('#cn').value.trim())return;data.cards.push({id:Date.now(),name:$('#cn').value.trim(),type:$('#ct').value,opened:$('#co').value,af:+$('#caf').value||0,reports:$('#cr').checked,five24Override:$('#c524').value});save();showView('cardsView')}
function showEditCard(id){const c=data.cards.find(x=>x.id===id);if(!c)return;const box=$('#addCardBox');if(!box)return;box.innerHTML=`<div class="card" style="margin-bottom:12px"><h3>Edit card</h3><div class="formgrid"><div class="field"><label class="field-label" for="ecn">Card name</label><textarea class="namebox" id="ecn">${c.name}</textarea></div><div class="field"><label class="field-label" for="ect">Card type</label><select id="ect"><option ${c.type==='Business'?'selected':''}>Business</option><option ${c.type==='Personal'?'selected':''}>Personal</option></select></div><div class="field"><label class="field-label" for="ecaf">Annual fee</label><input id="ecaf" type="number" value="${c.af||0}"></div><div class="field"><label class="field-label" for="eco">Account open date</label><input id="eco" type="date" value="${c.opened||''}"></div></div><div class="subbox"><label class="field-label" for="ec524">5/24 treatment</label><select id="ec524"><option value="auto" ${(c.five24Override||'auto')==='auto'?'selected':''}>Auto / based on reporting</option><option value="count" ${c.five24Override==='count'?'selected':''}>Force: counts toward 5/24</option><option value="nocount" ${c.five24Override==='nocount'?'selected':''}>Force: does not count toward 5/24</option></select><label class="small" style="display:block;margin:10px 0"><input id="ecr" type="checkbox" style="width:auto" ${c.reports?'checked':''}> Reports as personal account</label></div><div class="row" style="margin-top:12px"><button onclick="saveCardEdit(${c.id})">Save changes</button><button class="btn ghost" onclick="clearCardEditor()">Cancel</button></div></div>`;box.scrollIntoView({behavior:'smooth',block:'start'})}
function clearCardEditor(){const box=$('#addCardBox');if(box)box.innerHTML=''}
function saveCardEdit(id){const c=data.cards.find(x=>x.id===id);if(!c)return;c.name=$('#ecn').value.trim()||c.name;c.type=$('#ect').value;c.af=+$('#ecaf').value||0;c.opened=$('#eco').value||c.opened;c.reports=$('#ecr').checked;c.five24Override=$('#ec524').value;delete c.sub;save();showView('cardsView')}
function removeCard(id){const c=data.cards.find(x=>x.id===id);if(!c)return;if(!confirm(`Remove ${c.name}? This cannot be undone.`))return;data.cards=data.cards.filter(c=>c.id!==id);save();showView('cardsView')}
function apply(){const ranked=rankedOffers(),counts={consider:0,wait:0,save:0,avoid:0};ranked.forEach(x=>counts[x.fit.status]++);const f=five24();return `<div class="section" style="margin-top:0">Apply Next</div>${f>=5?`<div class="warningbox"><b>${f}/24: Chase cards are ${data.profile.includeChaseOver524?'included by your override':'grayed out by default'}.</b><div class="small" style="margin-top:5px">CardPilot treats 5/24+ as a strong reason not to recommend Chase personal or business applications.</div>${!data.profile.includeChaseOver524?`<button class="btn ghost" style="margin-top:9px" onclick="data.profile.includeChaseOver524=true;save();showView('applyView')">Include Chase anyway</button>`:`<button class="btn ghost" style="margin-top:9px" onclick="data.profile.includeChaseOver524=false;save();showView('applyView')">Gray Chase again</button>`}</div>`:''}<div class="card" style="margin-bottom:12px"><div class="small">YOUR FILTERS</div><h3 style="margin-top:4px">${pathLabel()}</h3><div class="small">Annual fee: ${feePrefLabel()} • Interests: ${interestsLabel()} • 5/24: ${f}/24</div><div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn ghost" onclick="restartSetup()">Change preferences</button></div></div><div class="card" style="margin-bottom:12px"><div class="small">HOW THE ALGORITHM IS THINKING</div><h3 style="margin-top:4px">${counts.consider} consider • ${counts.wait} wait • ${counts.save} preserve</h3><div class="small">Cards are ranked by pathway, 5/24 constraints, annual-fee preference, offer strength versus historical highs, and every interest you selected.</div></div><div class="section">For you</div><div class="list">${ranked.map(x=>offerCard(x.offer,true,x.fit)).join('')}</div>${data.profile.cpTargetYear?`<div class="section">Saved strategy</div><div class="card"><h3>Southwest Companion Pass</h3><div class="small">CardPilot is preserving Southwest business-card opportunities for your ${data.profile.cpTargetYear} plan instead of recommending them now.</div></div>`:''}`}
function offerCard(o,reason=false,fit=null){
  fit=fit||offerFit(o);
  const cls=fit.status==='consider'?'green':fit.status==='wait'?'amber':fit.status==='save'?'blue':'red';
  return `<div class="item ${fit.disabled?'disabled-card':''}"><div class="between"><div><div class="item-title">${o.name}</div><div class="meta">${o.issuer||''}${o.issuer?' • ':''}${o.type} • AF ${fmt(o.af)} • ${o.spend!==null&&o.spend!==undefined?'Spend '+fmt(o.spend):'Spend: verify'}</div></div><span class="pill ${cls}">${fit.label}</span></div><div class="between" style="margin-top:9px"><div><b>${Number(o.bonus||0)?Number(o.bonus).toLocaleString()+' '+o.unit:'Offer varies / verify'}</b></div><div class="small">${fit.strength!==null?fit.strength+'% of historical high':'Historical high not set'}</div></div>${o.offerNote?`<div class="small" style="margin-top:6px">${o.offerNote}</div>`:''}${reason?`<div class="small" style="margin-top:7px"><b>Fit score ${fit.score}/100.</b> ${fit.reasons[0]||fit.cautions[0]||''}</div><button class="btn ghost" style="margin-top:8px;padding:7px 10px" onclick="whyOffer(${o.id})">Why?</button>`:''}<div class="small" style="margin-top:7px">${o.verified?'Verified '+o.verifiedDate:'Needs verification'}</div></div>`
}
function whyOffer(id){
  const o=data.offers.find(x=>x.id===id);if(!o)return;
  const fit=offerFit(o);
  const parts=[`${o.name}: ${fit.label} (${fit.score}/100)`];
  if(fit.reasons.length)parts.push('Why it fits:\n• '+fit.reasons.join('\n• '));
  if(fit.cautions.length)parts.push('What holds it back:\n• '+fit.cautions.join('\n• '));
  parts.push(`Pathway: ${pathLabel()}. CardPilot evaluates 5/24 constraints, annual-fee preference, offer strength versus historical highs, your selected interests, and any strategy you are intentionally preserving.`);
  alert(parts.join('\n\n'));
}

function offers(){
  const list=pathwayOffers();
  const issuers=[...new Set(list.map(o=>o.issuer||'Other'))].sort();
  return `<div class="between"><div><div class="section" style="margin-top:0">${data.profile.cardPath==='business'?'Business card market':data.profile.cardPath==='personal'?'Personal card market':'Card market'}</div><div class="small">${list.length} cards in this pathway • catalog snapshot ${data.catalogVersion||''}</div></div></div>
  <div class="card" style="margin:12px 0"><div class="small">PATHWAY</div><div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn ${data.profile.cardPath==='business'?'':'ghost'}" onclick="setCardPath('business')">Business</button><button class="btn ${data.profile.cardPath==='personal'?'':'ghost'}" onclick="setCardPath('personal')">Personal</button><button class="btn ${data.profile.cardPath==='either'?'':'ghost'}" onclick="setCardPath('either')">Both</button></div><div class="help">The selected pathway controls both the market view and Apply Next algorithm.</div><div class="field" style="margin-top:12px"><label class="field-label">Search this market</label><input id="marketSearch" placeholder="Search issuer, card, airline, hotel, cash back…" oninput="filterMarket()"></div></div>
  <div id="marketGroups">${issuers.map(issuer=>`<div class="market-group" data-issuer="${issuer.toLowerCase()}"><div class="section">${issuer}</div><div class="list">${list.filter(o=>(o.issuer||'Other')===issuer).map(o=>`<div class="market-card" data-search="${`${o.name} ${o.issuer} ${(o.tags||[]).join(' ')} ${o.status||''}`.toLowerCase()}">${offerCard(o,false,offerFit(o))}</div>`).join('')}</div></div>`).join('')}</div>
  <div class="note" style="margin-top:16px"><b>Database structure:</b> Card identity is kept separate from changing offer information in the recommendation logic. Statuses such as closed-new, membership, regional, or availability-varies are retained so existing users can track cards without CardPilot pretending they are universally open to new applicants. Offers change frequently and should be verified before application.</div>`;
}
function filterMarket(){const q=($('#marketSearch')?.value||'').trim().toLowerCase();$$('.market-card').forEach(el=>el.style.display=!q||el.dataset.search.includes(q)?'':'none');$$('.market-group').forEach(g=>{const any=[...g.querySelectorAll('.market-card')].some(x=>x.style.display!=='none');g.style.display=any?'':'none'})}

function benefits(){const sorted=[...data.benefits].sort((a,b)=>new Date(a.expires)-new Date(b.expires));return `<div class="between"><div class="section" style="margin-top:0">Benefits</div><button onclick="showAddBenefit()">+ Add</button></div><div id="addBenefitBox"></div><div class="list">${sorted.map(b=>`<div class="item between"><div><div class="item-title">${b.name}</div><div class="meta">${b.value||''} • Expires ${b.expires}</div></div><span class="pill ${daysTo(b.expires)<60?'red':daysTo(b.expires)<120?'amber':'green'}">${daysTo(b.expires)} days</span></div>`).join('')||'<div class="empty">No benefits tracked yet.</div>'}</div>`}
function showAddBenefit(){const box=$('#addBenefitBox');if(!box)return;box.innerHTML=`<div class="card" style="margin-bottom:12px"><h3>Add benefit</h3><div class="formgrid"><input id="bn" placeholder="Benefit name"><input id="bv" placeholder="Value / note"><input id="be" type="date"></div><button style="margin-top:10px" onclick="addBenefit()">Save benefit</button></div>`}
function addBenefit(){if(!$('#bn').value)return;data.benefits.push({id:Date.now(),name:$('#bn').value,value:$('#bv').value,expires:$('#be').value});save();showView('benefitsView')}
function render(){ $('#homeView').innerHTML=home(); $('#cardsView').innerHTML=cards(); $('#applyView').innerHTML=apply(); $('#offersView').innerHTML=offers(); $('#benefitsView').innerHTML=benefits(); }
function showView(id){$$('main section').forEach(s=>s.classList.add('hidden')); $('#'+id).classList.remove('hidden'); $$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===id)); const titles={homeView:'CardPilot',cardsView:'My Cards',applyView:'Apply Next',offersView:'Offers',benefitsView:'Benefits'}; $('#title').textContent=titles[id]; window.scrollTo(0,0)}
$$('.tab').forEach(t=>t.onclick=()=>showView(t.dataset.view));
render(); showView('homeView'); if('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');
</script>
</body></html>
