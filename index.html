function five24Cutoff(){const d=new Date(); d.setHours(0,0,0,0); d.setMonth(d.getMonth()-24); return d}

  if(c.five24Override==='count')return true;

  const opened=validOpenDate(c);
  return !!opened&&opened>=five24Cutoff();
}

function five24Status(c){
  if(c.five24Override==='count')return {label:'Counts toward 5/24',reason:'Manual override',tone:'amber'};

  if(!opened)return {label:'Verify 5/24',reason:'Open date missing',tone:'amber'};

  return {label:'Counts toward 5/24',reason:'Opened within 24 months',tone:'amber'};
}

function recommendationScreen(){const p=recommendationPlan(),headline=p.best?`Recommended cards for you`:'Your strategy is ready';const preferred=p.ranked.filter(x=>x.fit.status==='consider').slice(0,3);const fallback=preferred.length?preferred:p.ranked.filter(x=>x.fit.status==='wait').slice(0,3);const cards=fallback.length?fallback:p.ranked.slice(0,3);return `<div class="recap"><div class="small">YOUR CARDPILOT PLAN</div><h2>${headline}</h2><div class="small">Based on ${p.f}/24, ${pathLabel()}, fee preference (${feePrefLabel()}), selected interests (${interestsLabel()}), preferred airlines (${preferredAirlineLabel()}), saved relationships (${relationshipSummary()}), benefit-overlap preference (${overlapPrefLabel()}), and owned-card rule (${data.profile.excludeOwnedCards!==false?'exclude exact cards already held':'include existing cards'}).</div><div class="section" style="margin-top:18px">Top recommendations</div><div class="list">${cards.length?cards.map(x=>offerCard(x.offer,true,x.fit)).join(''):'<div class="empty">No cards currently match your selected preferences. Try widening your filters.</div>'}</div>${p.steps.length?`<div class="section" style="margin-top:18px">Strategy notes</div>${p.steps.map((x,i)=>`<div class="rec-row"><div class="rec-num">${i+1}</div><div><div class="rec-title">${x.title}</div><div class="small" style="margin-top:3px">${x.detail}</div></div></div>`).join('')}`:''}<div class="rec-actions"><button onclick="data.profile.showRecommendation=false;save();showView('homeView')">Go to dashboard</button><button class="btn ghost" onclick="data.profile.showRecommendation=false;save();showView('applyView')">See all options</button></div><div style="text-align:center;margin-top:10px"><button class="btn ghost" onclick="restartSetup()">Start over questions</button></div></div>`}
function home(){if(!setupComplete())return onboarding();if(data.profile.showRecommendation)return recommendationScreen();const f=five24(),exp=[...data.benefits].filter(b=>b.expires).sort((a,b)=>new Date(a.expires)-new Date(b.expires))[0],action=nextAction(),needs=setupNeeds();return `<div class="hero"><div class="small">WHAT SHOULD I DO NOW?</div><h2>${action.title}</h2><div>${action.detail}</div><div class="small" style="margin-top:8px"><b>Why:</b> ${action.why}</div><button class="primary-action" onclick="showView('applyView')">Show me what to consider</button></div>${needs.length?`<div class="note"><b>CardPilot needs ${needs.length} more thing${needs.length>1?'s':''} from you.</b>${needs.map(x=>`<div class="todo"><span class="stepdot">›</span><span>${x}</span></div>`).join('')}</div>`:''}${(()=>{const rp=recommendationPlan();return `<div class="card" style="margin-top:14px"><div class="between"><div><div class="small">YOUR PLAN</div><h3 style="margin-top:4px">${rp.steps[0]?rp.steps[0].title:'Your strategy is ready'}</h3></div><button class="btn ghost" onclick="openPlan()">View full plan</button></div>${rp.steps[1]?`<div class="small" style="margin-top:8px"><b>Next:</b> ${rp.steps[1].title}</div>`:''}</div>`})()}<div class="grid" style="margin-top:14px"><div class="card"><div class="small">Chase 5/24</div><div class="big">${data.cards.length?f+'/24':'—'}</div><div class="small">${data.cards.length?(f>=5?'Chase grayed by default':Math.max(0,5-f)+' slots before 5/24'):'Add personal card dates'}</div></div><div class="card"><div class="small">Pathway</div><div class="kpi">${pathLabel()}</div><div class="small">Change in setup anytime</div></div><div class="card"><div class="small">Annual fee</div><div class="kpi">${feePrefLabel()}</div><div class="small">Recommendation preference</div></div><div class="card"><div class="small">Expiring soon</div><div class="kpi">${exp?daysTo(exp.expires)+' days':'—'}</div><div class="small">${exp?exp.name:'No benefit added'}</div></div></div><div class="card" style="margin-top:16px;text-align:center"><div class="small">SETUP & PREFERENCES</div><h3 style="margin:5px 0 8px">Update your strategy anytime</h3><div class="small" style="margin-bottom:10px">Change banking relationships without restarting onboarding, or answer the setup questions again.</div><div class="row" style="justify-content:center;flex-wrap:wrap"><button class="btn ghost" onclick="showView('relationshipsView')">Relationships & ecosystems</button><button class="btn ghost" onclick="restartSetup()">Start over questions</button></div></div>`}

let addCardFilter='both';
function cards(){return `<div class="between" style="justify-content:flex-end;margin-bottom:10px"><button onclick="showAddCard()">+ Add</button></div><div id="addCardBox"></div><div class="list">${data.cards.map(c=>{const st=five24Status(c);return `<div class="item"><div class="between"><div style="min-width:0"><div class="item-title" style="overflow-wrap:anywhere">${c.name}</div><div class="meta">${c.type} • Account opened ${c.opened||'not set'} • AF ${fmt(c.af||0)}</div></div><span class="pill ${st.tone}" style="text-align:center;max-width:150px;white-space:normal;line-height:1.2">${st.label}${st.reason?`<br><span style="font-size:10px;font-weight:600">${st.reason}</span>`:''}</span></div><div class="card-actions"><button class="btn ghost" style="padding:7px 10px" onclick="showEditCard(${c.id})">Edit</button><button class="btn ghost danger" style="padding:7px 10px" onclick="removeCard(${c.id})">Remove</button></div></div>`}).join('')}</div>`}
function showAddCard(){const box=$('#addCardBox');if(!box)return;addCardFilter='both';box.innerHTML=`<div class="card" style="margin-bottom:12px"><h3>Add card</h3><div class="small">CARD DATABASE</div><div class="row" style="margin:8px 0 12px;flex-wrap:wrap"><button id="acfPersonal" class="btn ghost" onclick="setAddCardFilter('personal')">Personal</button><button id="acfBusiness" class="btn ghost" onclick="setAddCardFilter('business')">Business</button><button id="acfBoth" class="btn" onclick="setAddCardFilter('both')">Both</button></div><div class="field"><label class="field-label" for="cardSearch">Find your card</label><input id="cardSearch" placeholder="Search card or issuer — e.g. Sapphire, Amex Gold, Atmos" oninput="renderCardSearch()"><div id="cardSearchResults" class="list" style="margin-top:8px"></div><div class="help">Choose a card to prefill type, annual fee, and normal 5/24 treatment. Can't find it? Add it manually below.</div></div><div class="subbox"><div class="formgrid"><div class="field"><label class="field-label" for="cn">Card name</label><textarea class="namebox" id="cn" placeholder="Card name"></textarea></div><div class="field"><label class="field-label" for="ct">Card type</label><select id="ct"><option>Business</option><option>Personal</option></select></div><div class="field"><label class="field-label" for="caf">Annual fee</label><input id="caf" type="number" placeholder="Annual fee"></div><div class="field"><label class="field-label" for="co">Account open date</label><input id="co" type="date"></div></div><div id="selectedCardMeta" class="help"></div></div><div class="subbox"><label class="field-label" for="c524">5/24 treatment</label><select id="c524"><option value="auto">Auto / based on reporting</option><option value="count">Force: counts toward 5/24</option><option value="nocount">Force: does not count toward 5/24</option></select><label class="small" style="display:block;margin:10px 0"><input id="cr" type="checkbox" style="width:auto"> Reports as personal account</label><div class="help">Use an override only when you know the account should be treated differently.</div></div><button style="margin-top:12px" onclick="addCard()">Save card</button></div>`}
function setAddCardFilter(f){addCardFilter=f;['Personal','Business','Both'].forEach(x=>{const el=$('#acf'+x);if(el)el.className='btn '+(f===x.toLowerCase()||f==='both'&&x==='Both'?'':'ghost')});renderCardSearch()}
function catalogCardsForAdd(){const all=[...data.offers];const seen=new Set();return all.filter(o=>{const k=(o.issuer+'|'+o.name+'|'+o.type).toLowerCase();if(seen.has(k))return false;seen.add(k);return true})}
function renderCardSearch(){const q=($('#cardSearch')?.value||'').trim().toLowerCase(),box=$('#cardSearchResults');if(!box)return;if(!q){box.innerHTML='';return}let rows=catalogCardsForAdd().filter(o=>(addCardFilter==='both'||o.type.toLowerCase()===addCardFilter)&&(`${o.name} ${o.issuer} ${(o.tags||[]).join(' ')}`).toLowerCase().includes(q)).slice(0,10);box.innerHTML=rows.map(o=>`<button class="choice" onclick="chooseCatalogCard(${o.id})"><b>${o.name}</b><br><span class="small">${o.issuer} • ${o.type} • AF ${fmt(o.af||0)}</span></button>`).join('')||'<div class="small">No matching card. Use manual entry below.</div>'}
function chooseCatalogCard(id){const o=data.offers.find(x=>x.id===id);if(!o)return;$('#cn').value=o.name;$('#ct').value=o.type;$('#caf').value=o.af||0;$('#cr').checked=!!o.reports;$('#c524').value='auto';const m=$('#selectedCardMeta');if(m)m.innerHTML=`Selected: <b>${o.issuer} ${o.name}</b> • ${o.type}. ${o.reports?'Normally treated as a personal-reporting account for this database.':'Normally treated as not reporting as a personal revolving account for this database.'}`}
function addCard(){if(!$('#cn').value.trim())return;data.cards.unshift({id:Date.now(),name:$('#cn').value.trim(),type:$('#ct').value,opened:$('#co').value,af:+$('#caf').value||0,reports:$('#cr').checked,five24Override:$('#c524').value});save();showView('cardsView')}
function showEditCard(id){const c=data.cards.find(x=>x.id===id);if(!c)return;const box=$('#addCardBox');if(!box)return;box.innerHTML=`<div class="card" style="margin-bottom:12px"><h3>Edit card</h3><div class="formgrid"><div class="field"><label class="field-label" for="ecn">Card name</label><textarea class="namebox" id="ecn">${c.name}</textarea></div><div class="field"><label class="field-label" for="ect">Card type</label><select id="ect"><option ${c.type==='Business'?'selected':''}>Business</option><option ${c.type==='Personal'?'selected':''}>Personal</option></select></div><div class="field"><label class="field-label" for="ecaf">Annual fee</label><input id="ecaf" type="number" value="${c.af||0}"></div><div class="field"><label class="field-label" for="eco">Account open date</label><input id="eco" type="date" value="${c.opened||''}"></div></div><div class="subbox"><label class="field-label" for="ec524">5/24 treatment</label><select id="ec524"><option value="auto" ${(c.five24Override||'auto')==='auto'?'selected':''}>Auto / based on reporting</option><option value="count" ${c.five24Override==='count'?'selected':''}>Force: counts toward 5/24</option><option value="nocount" ${c.five24Override==='nocount'?'selected':''}>Force: does not count toward 5/24</option></select><label class="small" style="display:block;margin:10px 0"><input id="ecr" type="checkbox" style="width:auto" ${c.reports?'checked':''}> Reports as personal account</label></div><div class="row" style="margin-top:12px"><button onclick="saveCardEdit(${c.id})">Save changes</button><button class="btn ghost" onclick="clearCardEditor()">Cancel</button></div></div>`;box.scrollIntoView({behavior:'smooth',block:'start'})}
function clearCardEditor(){const box=$('#addCardBox');if(box)box.innerHTML=''}
function saveCardEdit(id){const c=data.cards.find(x=>x.id===id);if(!c)return;c.name=$('#ecn').value.trim()||c.name;c.type=$('#ect').value;c.af=+$('#ecaf').value||0;c.opened=$('#eco').value||c.opened;c.reports=$('#ecr').checked;c.five24Override=$('#ec524').value;delete c.sub;save();showView('cardsView')}
function removeCard(id){const c=data.cards.find(x=>x.id===id);if(!c)return;if(!confirm(`Remove ${c.name}? This cannot be undone.`))return;data.cards=data.cards.filter(c=>c.id!==id);save();showView('cardsView')}
function relationshipsPage(){const r=data.profile.relationships||{};return `<div class="between"><div><div class="section" style="margin-top:0">Relationships & ecosystems</div><div class="small">CardPilot uses these relationships when they materially improve card rewards, credits, or eligibility.</div></div><button class="btn ghost" onclick="showView('homeView')">Done</button></div><div class="card" style="margin-top:14px"><div class="small">WHY THIS MATTERS</div><h3 style="margin-top:4px">Relationship benefits can change the best card</h3><div class="small">Examples include boosted Bank of America rewards, Citi relationship credits, and relationship-only Amex Platinum variants. These settings affect recommendations but do not override a poor match with your selected goals.</div></div><div class="card" style="margin-top:12px">${relationshipChoicesHTML()}${overlapChoicesHTML()}<div class="note" style="margin-top:12px"><b>Saved automatically.</b> Changes here immediately update Apply Next and offer rankings.</div></div><div class="section">Current relationships</div><div class="card"><div class="kpi">${relationshipSummary()}</div><div class="small" style="margin-top:5px">You can return here anytime from Home or Apply Next.</div></div>`}
function apply(){const ranked=rankedOffers(),counts={consider:0,wait:0,save:0,avoid:0};ranked.forEach(x=>counts[x.fit.status]++);const f=five24();const overlap=companionSelected()?companionOverlapAdvice():null;const sw=southwestTimingAdvice();return `<div class="section" style="margin-top:0">Apply Next</div>${f>=5?`<div class="warningbox"><b>${f}/24: Chase cards are ${data.profile.includeChaseOver524?'included by your override':'grayed out by default'}.</b><div class="small" style="margin-top:5px">CardPilot treats 5/24+ as a strong reason not to recommend Chase personal or business applications.</div>${!data.profile.includeChaseOver524?`<button class="btn ghost" style="margin-top:9px" onclick="data.profile.includeChaseOver524=true;save();showView('applyView')">Include Chase anyway</button>`:`<button class="btn ghost" style="margin-top:9px" onclick="data.profile.includeChaseOver524=false;save();showView('applyView')">Gray Chase again</button>`}</div>`:''}${overlap?`<div class="note" style="margin-bottom:12px"><b>Companion benefit strategy:</b> ${overlap.message}</div>`:''}<div class="card" style="margin-bottom:12px"><div class="small">YOUR FILTERS</div><h3 style="margin-top:4px">${pathLabel()}</h3><div class="small">Annual fee: ${feePrefLabel()} • Interests: ${interestsLabel()} • Airlines: ${preferredAirlineLabel()} • Relationships: ${relationshipSummary()} • Overlap: ${overlapPrefLabel()} • Existing cards: ${data.profile.excludeOwnedCards!==false?'excluded':'included'} • 5/24: ${f}/24</div><div class="row" style="margin-top:10px;flex-wrap:wrap"><button class="btn ghost" onclick="restartSetup()">Change preferences</button><button class="btn ghost" onclick="showView('relationshipsView')">Relationships & ecosystems</button></div></div><div class="card" style="margin-bottom:12px"><div class="small">HOW THE ALGORITHM IS THINKING</div><h3 style="margin-top:4px">${counts.consider} consider • ${counts.wait} wait • ${counts.save} preserve</h3><div class="small">Specific benefit choices now outrank generic category matches. Existing companion benefits can lower the priority of overlapping companion cards until the current benefit is closer to expiration.</div></div>${sw?`<div class="card strategy-card" style="margin-bottom:12px"><div class="small">SAVED STRATEGY</div><h3>Southwest Companion Pass — target ${sw.target}</h3><div class="small">Suggested application window: <b>${sw.applyWindow}</b></div><div class="small" style="margin-top:6px">${sw.note}</div></div>`:''}<div class="section">For you</div><div class="list">${ranked.map(x=>offerCard(x.offer,true,x.fit)).join('')}</div>`}
function offerCard(o,reason=false,fit=null){
  fit=fit||offerFit(o);
  const cls=fit.status==='consider'?'green':fit.status==='wait'?'amber':fit.status==='save'?'blue':'red';
  return `<div class="item ${fit.disabled?'disabled-card':''}"><div class="between"><div><div class="item-title">${o.name}</div><div class="meta">${o.issuer||''}${o.issuer?' • ':''}${o.type} • AF ${fmt(o.af)} • ${o.spend!==null&&o.spend!==undefined?'Spend '+fmt(o.spend):'Spend: verify'}</div></div><span class="pill ${cls}">${fit.label}</span></div><div class="between" style="margin-top:9px"><div><b>${Number(o.bonus||0)?Number(o.bonus).toLocaleString()+' '+o.unit:'Offer varies / verify'}</b></div><div class="small">${fit.strength!==null?fit.strength+'% of historical high':'Historical high not set'}</div></div>${o.offerNote?`<div class="small" style="margin-top:6px">${o.offerNote}</div>`:''}${reason?`<div class="small" style="margin-top:7px"><b>Fit score ${fit.score}/100.</b> ${fit.reasons[0]||fit.cautions[0]||''}</div><button class="btn ghost" style="margin-top:8px;padding:7px 10px" onclick="whyOffer(${o.id})">Why?</button>`:''}<div class="small" style="margin-top:7px">${o.verified?'Verified '+o.verifiedDate:'Needs verification'}</div></div>`
}
function whyOffer(id){
  const o=data.offers.find(x=>x.id===id);if(!o)return;
  const fit=offerFit(o);
  const parts=[`${o.name}: ${fit.label} (${fit.score}/100)`];
  if(fit.reasons.length)parts.push('Why it fits:\n• '+fit.reasons.join('\n• '));
  if(fit.cautions.length)parts.push('What holds it back:\n• '+fit.cautions.join('\n• '));
  parts.push(`Pathway: ${pathLabel()}. CardPilot evaluates 5/24 constraints, annual-fee preference, offer strength versus historical highs, your selected interests, banking/investment relationship benefits, and any strategy you are intentionally preserving.`);
  alert(parts.join('\n\n'));
}

function offers(){
  const list=pathwayOffers();
  const issuers=[...new Set(list.map(o=>o.issuer||'Other'))].sort();
  return `<div class="between"><div><div class="section" style="margin-top:0">${data.profile.cardPath==='business'?'Business card market':data.profile.cardPath==='personal'?'Personal card market':'Card market'}</div><div class="small">${list.length} cards in this pathway • catalog snapshot ${data.catalogVersion||''}</div></div></div>
  <div class="card" style="margin:12px 0"><div class="small">PATHWAY</div><div class="row" style="margin-top:8px;flex-wrap:wrap"><button class="btn ${data.profile.cardPath==='business'?'':'ghost'}" onclick="setCardPath('business')">Business</button><button class="btn ${data.profile.cardPath==='personal'?'':'ghost'}" onclick="setCardPath('personal')">Personal</button><button class="btn ${data.profile.cardPath==='either'?'':'ghost'}" onclick="setCardPath('either')">Both</button></div><div class="help">The selected pathway controls both the market view and Apply Next algorithm.</div><div class="field" style="margin-top:12px"><label class="field-label">Search this market</label><input id="marketSearch" placeholder="Search issuer, card, airline, hotel, cash back…" oninput="filterMarket()"></div></div>
  <div id="marketGroups">${issuers.map(issuer=>`<div class="market-group" data-issuer="${issuer.toLowerCase()}"><div class="section">${issuer}</div><div class="list">${list.filter(o=>(o.issuer||'Other')===issuer).map(o=>`<div class="market-card" data-search="${`${o.name} ${o.issuer} ${(o.tags||[]).join(' ')} ${o.status||''}`.toLowerCase()}">${offerCard(o,false,offerFit(o))}</div>`).join('')}</div></div>`).join('')}</div>
  <div class="note" style="margin-top:16px"><b>Database structure:</b> Card identity is kept separate from changing offer information in the recommendation logic. Statuses such as closed-new, membership, regional, or availability-varies are retained so existing users can track cards without CardPilot pretending they are universally open to new applicants. Offers change frequently and should be verified before application.</div>`;
}
function filterMarket(){const q=($('#marketSearch')?.value||'').trim().toLowerCase();$$('.market-card').forEach(el=>el.style.display=!q||el.dataset.search.includes(q)?'':'none');$$('.market-group').forEach(g=>{const any=[...g.querySelectorAll('.market-card')].some(x=>x.style.display!=='none');g.style.display=any?'':'none'})}

function benefits(){const sorted=[...data.benefits].sort((a,b)=>new Date(a.expires||'2999-12-31')-new Date(b.expires||'2999-12-31'));const sw=savedStrategy('southwest_cp');return `<div class="between"><div class="section" style="margin-top:0">Benefits & Strategies</div><button onclick="showAddBenefit()">+ Add</button></div><div class="card strategy-card" style="margin-bottom:12px"><div class="small">COMPANION BENEFITS</div><h3>Track passes, fares, and certificates</h3><div class="small">CardPilot uses expiration dates to avoid recommending unnecessary overlap and to suggest when to plan the next companion benefit.</div></div><div id="addBenefitBox"></div><div class="list">${sorted.map(b=>`<div class="item between"><div><div class="item-title">${b.name}</div><div class="meta">${b.kind==='companion'?'Companion benefit • ':''}${b.program?b.program+' • ':''}${b.value||''}${b.expires?' • Expires '+b.expires:''}</div></div>${b.expires?`<span class="pill ${daysTo(b.expires)<60?'red':daysTo(b.expires)<120?'amber':'green'}">${daysTo(b.expires)} days</span>`:''}</div>`).join('')||'<div class="empty">No benefits tracked yet.</div>'}</div><div class="section">Saved Strategies</div><div class="card"><h3>Southwest Companion Pass timing</h3><div class="small">Save a target qualification year only if you want CardPilot to preserve Southwest opportunities for that plan.</div><div class="formgrid" style="margin-top:10px"><div class="field"><label class="field-label">Target qualification year</label><input id="swTarget" type="number" min="2026" max="2035" value="${sw?.targetYear||''}" placeholder="e.g. 2028"></div><div class="field"><label class="field-label">Optional note</label><input id="swNote" value="${sw?.note||''}" placeholder="e.g. wait until current pass ends"></div></div><div class="row" style="margin-top:10px"><button onclick="saveSouthwestStrategy()">Save strategy</button>${sw?`<button class="btn ghost" onclick="removeSouthwestStrategy()">Remove</button>`:''}</div></div>`}
function showAddBenefit(){const box=$('#addBenefitBox');if(!box)return;box.innerHTML=`<div class="card" style="margin-bottom:12px"><h3>Add benefit</h3><div class="formgrid"><div class="field"><label class="field-label">Benefit name</label><input id="bn" placeholder="e.g. Atmos companion fare"></div><div class="field"><label class="field-label">Type</label><select id="bk"><option value="general">General benefit</option><option value="companion">Companion pass / fare / certificate</option></select></div><div class="field"><label class="field-label">Airline / program</label><input id="bp" placeholder="e.g. Southwest, Atmos"></div><div class="field"><label class="field-label">Expiration date</label><input id="be" type="date"></div></div><div class="field" style="margin-top:10px"><label class="field-label">Value / note</label><input id="bv" placeholder="Optional note"></div><button style="margin-top:10px" onclick="addBenefit()">Save benefit</button></div>`}
function addBenefit(){if(!$('#bn').value)return;data.benefits.push({id:Date.now(),name:$('#bn').value,kind:$('#bk').value,program:$('#bp').value,value:$('#bv').value,expires:$('#be').value});save();showView('benefitsView')}
function saveSouthwestStrategy(){const y=+($('#swTarget')?.value||0);if(!y){alert('Enter a target year.');return}data.profile.savedStrategies=(data.profile.savedStrategies||[]).filter(s=>s.type!=='southwest_cp');data.profile.savedStrategies.push({type:'southwest_cp',targetYear:y,note:$('#swNote')?.value||''});save();showView('benefitsView')}
function removeSouthwestStrategy(){data.profile.savedStrategies=(data.profile.savedStrategies||[]).filter(s=>s.type!=='southwest_cp');save();showView('benefitsView')}
function render(){
  $('#homeView').innerHTML=home();
  $('#cardsView').innerHTML=cards();
  try{$('#applyView').innerHTML=apply();}catch(e){console.error('Apply Next render error',e);$('#applyView').innerHTML=`<div class=\"card\"><h3>We hit a recommendation error</h3><div class=\"small\">${String(e&&e.message||e)}</div><button class=\"btn ghost\" style=\"margin-top:10px\" onclick=\"restartSetup()\">Review preferences</button></div>`;}
  $('#offersView').innerHTML=offers();
  $('#benefitsView').innerHTML=benefits();
  $('#relationshipsView').innerHTML=relationshipsPage();
}
function showView(id){$$('main section').forEach(s=>s.classList.add('hidden')); $('#'+id).classList.remove('hidden'); $$('.tab').forEach(t=>t.classList.toggle('active',t.dataset.view===id)); const titles={homeView:'CardPilot',cardsView:'My Cards',applyView:'Apply Next',offersView:'Offers',benefitsView:'Benefits',relationshipsView:'Relationships & Ecosystems'}; $('#title').textContent=titles[id]||'CardPilot'; window.scrollTo(0,0)}
$$('.tab').forEach(t=>t.onclick=()=>showView(t.dataset.view));
render(); const postTarget=data.profile.postSetupTarget; if(postTarget){delete data.profile.postSetupTarget; localStorage.setItem('cardpilotData',JSON.stringify(data)); showView(postTarget)}else{showView('homeView')} if('serviceWorker' in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{}); if(window.caches){caches.keys().then(keys=>Promise.all(keys.map(k=>caches.delete(k)))).catch(()=>{});}}
</script>
</body></html>
