name: CardPilot Card Data Check

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 14:15 UTC. GitHub scheduled jobs may start a little late.
    - cron: '15 14 * * *'

permissions:
  contents: write
  issues: write

concurrency:
  group: cardpilot-card-data-check
  cancel-in-progress: false

jobs:
  check-and-update:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run existing catalog verification
        shell: bash
        run: |
          if [ -f scripts/verify-catalog.mjs ]; then
            node scripts/verify-catalog.mjs
          else
            echo 'scripts/verify-catalog.mjs not found; skipping existing catalog verification.'
          fi

      - name: Validate automation inputs
        run: node scripts/validate-auto-update.mjs cards.json

      - name: Run existing link checker
        continue-on-error: true
        shell: bash
        run: |
          if [ -f scripts/check-links.mjs ]; then
            node scripts/check-links.mjs
          else
            echo 'scripts/check-links.mjs not found; skipping link check.'
          fi

      - name: Check issuer offers
        id: offers
        continue-on-error: true
        run: node scripts/check-offers.mjs cards.json offer-report.json

      - name: Apply only high-confidence offer changes
        if: always()
        run: node scripts/auto-update-offers.mjs cards.json offer-report.json

      - name: Validate catalog after automatic updates
        if: always()
        run: node scripts/validate-auto-update.mjs cards.json

      - name: Re-run existing catalog verification
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          if [ -f scripts/verify-catalog.mjs ]; then
            node scripts/verify-catalog.mjs
          fi

      - name: Add automation summary
        if: always()
        shell: bash
        run: |
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '## CardPilot automatic offer update' >> "$GITHUB_STEP_SUMMARY"
          if [ -f auto-update-report.json ]; then
            node -e "const r=require('./auto-update-report.json'); console.log('- Auto-updated: '+(r.autoUpdated||0)+'\n- Needs human review: '+(r.needsHumanReview||0))" >> "$GITHUB_STEP_SUMMARY"
          else
            echo '- No auto-update report was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi


      - name: Create or update review notification issue
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const title = '[CardPilot] Offer review needed';
            let offer = {};
            let auto = {};
            try { offer = JSON.parse(fs.readFileSync('offer-report.json','utf8')); } catch {}
            try { auto = JSON.parse(fs.readFileSync('auto-update-report.json','utf8')); } catch {}

            const needsReview = Number(offer?.counts?.needs_review || 0);
            const blocked = Number(offer?.counts?.blocked_by_issuer || 0);
            const broken = Number(offer?.counts?.broken || 0);
            const human = Number(auto?.needsHumanReview || 0);
            const shouldNotify = needsReview > 0 || broken > 0 || human > 0;

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', per_page: 100
            });
            const existing = issues.find(i => i.title === title && !i.pull_request);

            if (shouldNotify) {
              const reviewItems = Array.isArray(offer.results)
                ? offer.results.filter(r => ['needs_review','broken'].includes(r.status)).slice(0,20)
                : [];
              const lines = reviewItems.map(r => {
                const detail = Array.isArray(r.issues) && r.issues.length ? ` — ${r.issues.join('; ')}` : '';
                return `- **${r.issuer || ''} — ${r.name || ''}**: ${r.status}${detail}`;
              });
              const body = [
                `@${owner} CardPilot found items that need attention.`,
                '',
                `- Needs review: ${needsReview}`,
                `- Human-review offer changes: ${human}`,
                `- Broken sources: ${broken}`,
                `- Blocked by issuer: ${blocked}`,
                '',
                '### Items needing review',
                ...(lines.length ? lines : ['- See the latest CardPilot Card Data Check workflow summary.']),
                '',
                `Last workflow: ${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`
              ].join('\n');

              if (existing) {
                await github.rest.issues.update({ owner, repo, issue_number: existing.number, body });
                await github.rest.issues.createComment({
                  owner, repo, issue_number: existing.number,
                  body: `Updated by workflow run ${context.runNumber}.`
                });
              } else {
                await github.rest.issues.create({ owner, repo, title, body });
              }
            } else if (existing) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: existing.number,
                body: 'Latest automated check is clear. Closing this review issue.'
              });
              await github.rest.issues.update({ owner, repo, issue_number: existing.number, state: 'closed' });
            }

      - name: Commit safe catalog and monitoring changes
        if: always()
        shell: bash
        run: |
          git add cards.json offer-report.json auto-update-report.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No catalog/report changes to commit.'
            exit 0
          fi
          git config user.name 'cardpilot-offer-bot'
          git config user.email 'cardpilot-offer-bot@users.noreply.github.com'
          git commit -m 'chore: automated CardPilot offer check'
          git push

      - name: Fail only for genuinely broken issuer sources
        if: steps.offers.outcome == 'failure'
        shell: bash
        run: |
          if [ ! -f offer-report.json ]; then
            echo 'Offer checker failed before producing offer-report.json.'
            exit 1
          fi
          node -e "const r=require('./offer-report.json'); if ((r.counts?.broken||0)>0) { console.error('Broken issuer sources: '+r.counts.broken); process.exit(1); }"
