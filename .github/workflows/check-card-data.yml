name: Check CardPilot card data

"on":
  workflow_dispatch: {}
  schedule:
    - cron: "17 13 * * *"
  push:
    paths:
      - "cards.json"
      - "scripts/check-links.mjs"
      - "scripts/check-offers.mjs"
      - "scripts/verify-catalog.mjs"
      - ".github/workflows/check-card-data.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate catalog structure
        run: node scripts/verify-catalog.mjs cards.json

      - name: Check issuer links
        run: node scripts/check-links.mjs cards.json

      - name: Check configured offer terms
        run: node scripts/check-offers.mjs cards.json

      - name: Upload monitoring reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cardpilot-data-monitoring-reports
          path: |
            link-report.json
            offer-report.json
          if-no-files-found: warn
