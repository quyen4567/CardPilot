name: CardPilot catalog quality
on:
  push:
    paths: ['index.html', 'cards.json', 'scripts/**', '.github/workflows/**', 'staging/**', 'package*.json', 'release-candidate/**']
  pull_request:
    paths: ['index.html', 'cards.json', 'scripts/**', '.github/workflows/**', 'staging/**', 'package*.json', 'release-candidate/**']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/validate-auto-update.mjs cards.json
      - run: node scripts/verify-catalog.mjs cards.json
      - run: npm test
      - run: node scripts/validate-auto-update.mjs staging/cards.json
      - run: npm run test:staging
      - run: node scripts/release-audit.mjs staging/cards.json staging/release-audit.json --report-only
      - name: Validate public release candidate
        run: |
          node scripts/validate-auto-update.mjs release-candidate/cards.json
          node scripts/release-audit.mjs release-candidate/cards.json release-candidate/release-audit.json
      - name: Browser-test exact public release candidate
        env:
          CARDPILOT_CANDIDATE_DIRECTORY: release-candidate
        run: npm run test:staging
      - name: Prepare approved public files
        run: node scripts/prepare-release.mjs release-candidate approved-public
      - uses: actions/upload-artifact@v4
        with:
          name: cardimize-approved-public
          path: |
            approved-public
            release-candidate/browser-qa.json
            release-candidate/release-audit.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cardpilot-staging-review
          path: |
            staging/release-audit.json
            staging/browser-qa.json
